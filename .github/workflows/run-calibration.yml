name: Wave 4 Calibration Run

on:
  workflow_dispatch:
    inputs:
      report_only:
        description: 'Report only (no updates to verified values)'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    environment: Agent
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Wave 4 Calibration (via Slack)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CALIBRATION_CHANNEL: ${{ vars.CALIBRATION_CHANNEL || 'C07PZ7ZDH0N' }}
        run: |
          python scripts/run_calibration_via_slack.py
