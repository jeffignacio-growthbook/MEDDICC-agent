name: Daily Analytics ETL

on:
  schedule:
    # Full sync + reconciliation, twice a day (was every 4h). Freshness now
    # comes from the hourly incremental sync (hourly-deal-sync.yml); this run
    # is the safety net: keyset-paged full listing, deletion pass,
    # Supabase-vs-HubSpot reconciliation, and it re-sets the checkpoint.
    # :07 past 05/17 UTC to stay off the congested top-of-hour slots.
    - cron: '7 5,17 * * *'
  workflow_dispatch:

# Shared with hourly-deal-sync.yml: never two writers of deals / the
# incremental checkpoint at once. Queue rather than cancel.
concurrency:
  group: deals-supabase-sync
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests supabase python-dateutil pyyaml pytz

      - name: Analytics deal ETL (base upsert only)
        env:
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "Running daily base deals ETL (upserts deals table only)"
          echo "Snapshot/waterfall/forecast/win-loss remain weekly"
          python scripts/etl_deals.py --mode analytics

      # Fix A (#36) makes etl_deals exit non-zero on failure; without this a
      # red run notifies nobody. Same alert as the deal/calls ETLs.
      - name: Alert on failure
        if: failure()
        env:
          ZAPIER_ALERT_URL: ${{ secrets.ZAPIER_ALERT_URL }}
          # record_failure() counts prior failures in Supabase etl_failures;
          # without these it can't, and (pre-2026-09-23) then never alerted.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/alert_etl_failure.py \
            --job "etl-deals-analytics" \
            --run-id "${{ github.run_id }}"
