name: Probe Raw API Speaker Identity Fields (one-off)

# One-off diagnostic workflow, not part of the regular gates. READ-ONLY,
# no writes to Supabase or either call platform.
#
# Rep-coaching Criterion C investigation: does either Fireflies or
# Apollo's RAW API (not what this codebase currently extracts) expose a
# participant/speaker list tied to the ACTUAL diarized speakers, with
# email or account-level identity attached — separate from
# calls.participant_emails (confirmed derived from Fireflies'
# meeting_attendees, a calendar-invite list, and from Apollo's
# host/participants/transcript-entry fields).
#
# Report only. No primitive is designed or built here. Safe to delete
# once this one-time audit is done.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: Agent
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Probe raw API speaker-identity fields"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIREFLIES_API_KEY: ${{ secrets.FIREFLIES_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: |
          PYTHONPATH=.:scripts:api python3 scripts/probe_speaker_identity_fields.py
