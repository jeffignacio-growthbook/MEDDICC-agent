# Sales targets by quarter
# Used to calculate gap to plan, attainment %, and required pipeline coverage
#
# IMPORTANT: Emails match HubSpot owner records exactly. Mixed convention is deliberate:
# James and Scott use full form (james.shannon@, scott.keller@), others use short form.
# HubSpot is the system of record. These are the emails that actually own deals.
# DO NOT "normalize" to one format - it will break the join with deals.owner_email.

targets:
  fy2027_q3:
    team_total: 1550000
    basis: incremental_arr  # Reps are measured on Incremental ARR, never renewal base
    stretch_target: 2100000
    stretch_note: >
      Manually-set stretch figure, NOT computed or derived from any
      formula — a real, explicit GrowthBook business decision, specific
      to this client and this quarter. Exists because GrowthBook is
      targeting 2x YoY growth (Q2'27 vs Q2'26) that current headcount
      cannot organically support at the base quota alone. Confirmed
      2026-09-19. Never assume this generalizes to any future client
      this codebase might serve, and never treat it as a computed
      target the way team_total's per-rep sum is.
    reps:
      jake@growthbook.io:
        target: 300000
      christian@growthbook.io:
        target: 250000
      james.shannon@growthbook.io:
        target: 300000
        note: corrected from 250000 after week 3
      scott.keller@growthbook.io:
        target: 300000
      dan@growthbook.io:
        target: 250000
      marcel@growthbook.io:
        target: 150000
        ramp: true  # New AE on ramp quota (not full quota)
    non_quota_roles:
      - cary@growthbook.io
      - andy.marshall@growthbook.io
    non_quota_note: >
      Account Managers. Incremental ARR retires to team total; no individual
      quota by design. Not a data gap.
