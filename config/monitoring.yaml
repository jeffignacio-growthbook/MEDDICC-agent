# Wave 6 — Monitoring Configuration
# Updated 2026-09-05: Reconciled with original WAVES_4_5_6.md spec
#
# 6 original spec triggers + 2 additions:
#   - Trigger 7 (bulk_closed_lost): Added from Ivan Gomez investigation
#   - Trigger 8 (unscored_late_stage): Added during build, operationally useful

monitoring:
  enabled: true

  # Data integrity alerts (RevOps-facing)
  data_integrity:
    # Trigger 1: Attainment pace
    # SPEC: "12.7% two-thirds through a quarter. Threshold on pace relative to plan."
    # DISABLED: Requires quarterly plan data in config/targets.yaml or database
    #           Script runs but cannot fire until plan values are configured
    attainment_pace:
      enabled: false
      min_pace_pct: 75         # Alert if <75% of plan at 2/3 through quarter
      check_at_week: 8         # Check at week 8 of 13-week quarter
      min_arr_plan: 100000     # Minimum quarterly plan for meaningful check
      channel: "operational"

    # Trigger 2: Data completeness
    # SPEC: "127 active deals with no ARR. Alert when share crosses threshold."
    data_completeness:
      enabled: true
      max_null_share: 0.20     # Alert if >20% of active deals have no ARR
      min_deals: 50            # Minimum active deals for meaningful alert
      channel: "operational"

    # Trigger 3: Forecast category coverage
    # SPEC: "Three deals in COMMIT out of 432. Process finding that degrades quietly."
    forecast_category_coverage:
      enabled: true
      min_commit_share: 0.05   # Alert if <5% of pipeline is in COMMIT
      min_deals: 50            # Minimum pipeline size for meaningful check
      channel: "operational"

    # Trigger 4: Stale precomputed tables
    # SPEC: "forecast_weekly was 21 days old. Alert when computed_at exceeds refresh interval."
    stale_precomputed_tables:
      enabled: true
      tables:
        forecast_weekly:
          max_age_days: 8
          computed_at_column: "computed_at"
        waterfall_weekly:
          max_age_days: 8
          computed_at_column: "week_ending"
      channel: "operational"

    # Trigger 8: Unscored deals in late stage
    # NOT in original spec - added during build (2026-09-05)
    # RATIONALE: Late-stage deals without MEDDICC scores is operationally useful
    unscored_late_stage:
      enabled: true
      late_stages: ["Negotiating", "Proposal", "Technical Evaluation"]
      max_unscored_count: 5
      channel: "operational"

  # Correctness alerts (RevOps-facing)
  correctness:
    # Trigger 5: Metric divergence
    # SPEC: "Computed value disagrees with verified figure beyond tolerance."
    # DISABLED: compute_metric() placeholder not yet implemented
    #           Will sit silently doing nothing if enabled (always returns None)
    #           DO NOT enable until actual metric computation is wired up
    metric_divergence:
      enabled: false
      tolerance_pct: 5         # Alert if metric differs from verified by >5%
      min_evidence_count: 20   # Minimum denominator for reliability
      channel: "operational"

    # Trigger 6: Snapshot coverage
    # SPEC: "Week-3 grid with 192 rows against typical 475. Found weeks later."
    # IMPLEMENTATION: Per-pipeline comparison against same week-of-quarter in prior quarters
    snapshot_coverage:
      enabled: true
      min_row_share: 0.60      # Alert if <60% of typical rows
      trailing_quarters: 3     # Compare against last 3 quarters' same week
      per_pipeline: true       # Track each pipeline separately
      min_expected_rows: 50    # Skip alert if expected count < 50
      channel: "operational"

    # Trigger 7: Bulk closed-lost event detection
    # NOT in original spec - added from Ivan Gomez investigation (2026-09-05)
    # LESSON LEARNED: 281 deals closed in 59 minutes went undetected for 5 months
    bulk_closed_lost:
      enabled: true
      min_deal_count: 50              # Alert if >=50 deals closed within window
      time_window_minutes: 60         # Rolling 1-hour window
      check_frequency_minutes: 60     # Check every hour
      sample_size: 20                 # Number of deals to include in evidence
      ignore_won: true                # Only alert on closed-lost (not closed-won)
      min_owner_concentration: 0.5    # Alert if >50% from single owner/unassigned
      channel: "operational"

  # General settings
  suppression_window_days: 7    # Don't re-alert on same finding for 7 days
  evidence_bar_min_deals: 10    # Minimum population for meaningful alert

  # Alert destinations (Zapier routes these)
  channels:
    business: "cro_alerts"
    operational: "revops_alerts"
