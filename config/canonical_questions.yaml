# Wave 4 — Canonical Question Set
# Onboarding and quarterly calibration questions
#
# Sources:
# 1. fallback_log where trigger='success' (2 questions)
# 2. unanswered_queries meaningful failures (filtered)
# 3. The six exercised during debugging session (Sep 2-3, 2026)
#
# For each question:
# - question: the exact question text
# - shape: expected answer type (count, percentage, forecast, list, etc.)
# - verified_value: known-true value from client reports (where available)
# - source: where this question came from
# - handler: expected handler to answer it (if known)

questions:
