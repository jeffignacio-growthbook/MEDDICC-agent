# Client Configuration
# This file contains organization-specific settings for the MEDDICC analysis system.
# Students should update these values to match their organization's HubSpot setup.

# ============================================================================
# ORGANIZATION INFO
# ============================================================================
organization:
  name: "GrowthBook"
  crm: "HubSpot"
  sales_methodology: "MEDDICC"  # Options: MEDDICC, MEDDPICC, MEDDIC
  timezone: "America/Los_Angeles"  # Used for meddicc_last_analyzed date field
  internal_domains:
    - "growthbook.io"

# Controls how timestamps are converted to dates for metric reporting.
# Set this to wherever your sales leadership reviews numbers.
# Default (if omitted): organization.timezone. Fallback: UTC.
reporting:
  timezone: "America/New_York"   # IANA timezone name

fiscal:
  fy_start_month: 2  # FY starts Feb 1; Q2 FY2027 = May 1 - Jul 31 2026

# ============================================================================
# FORECAST CONFIGURATION
# ============================================================================
# Category-weighted forecast multipliers based on HubSpot's forecast_category field
# Uncomment to enable category-weighted forecasting in analytics

forecast:
  category_weights:
    COMMIT: 0.85
    MOST_LIKELY: 0.65
    BEST_CASE: 0.50
    PIPELINE: 0.15
    OMIT: 0.0
    CLOSED: 1.0
  # Used for category-weighted forecast. Values are a
  # RevOps-standard starting point — tune to your own
  # historical close rates once you have enough data.

# ============================================================================
# FORECAST ANALYSIS
# ============================================================================
# Empirical forecast calibration — measures actual commit hit rate and
# week-3 conversion against claimed accuracy. Analyses propose methodology
# changes when measured reality differs from config.

forecast_analysis:
  trailing_quarters_window: 9      # Trailing window for week-3 conversion
  anchor_week: null                # null = use measured value from category churn
                                   # When set: pins to specific week (1-13)
                                   # Empirically measured anchor replaces
                                   # instinctive hardcoded week-8 default
  claimed_commit_accuracy: 0.90    # Claimed commit hit rate for calibration
  basis: count                     # count | dollar — reporting basis
  segmentation_keys: [motion]      # Segment analyses by motion (newbiz/expansion)
  # TWO COVERAGE GATES, TWO DIFFERENT POPULATIONS. Deliberately.
  # They are not interchangeable and must never be compared to each other.
  #
  #   write gate    POPULATION: every row written, UNSCOPED — all pipelines,
  #                 all stages, including renewals, Meeting Set and
  #                 Disqualified. Guards write mechanics: pagination faults,
  #                 row caps, an inclusion rule that silently drops deals.
  #                 That is a property of the whole write, so it is measured
  #                 on the whole write.
  #
  #   snapshot gate POPULATION: the analytics-scoped subset only — default
  #                 pipeline, qualified non-excluded stages. Guards whether a
  #                 quarter is USABLE for conversion analysis. The analyses
  #                 read the scoped subset, so a percentage against the
  #                 unscoped total says nothing about whether what they read
  #                 is complete. On 2026-08-19 that was 164 of 415 rows: an
  #                 80% unscoped pass could sit on a badly incomplete scoped
  #                 population.
  #
  # Use point_in_time.is_deal_in_analytics_scope to build the scoped
  # population. Do not reimplement the filter.
  min_write_coverage_pct: 95       # UNSCOPED. Weekly snapshot must capture ≥95%
                                   # of genuinely open deals across all pipelines.
                                   # Fails loudly if coverage drops (catches row-cap bugs)
  max_write_coverage_pct: 105      # UNSCOPED. Must not capture >105% (catches
                                   # inclusion bugs — closed deals in an open snapshot)
  # Renamed from min_snapshot_coverage_pct. The old name did not say which
  # population it measured and had no consumer at all, so the first consumer
  # would have picked whichever population was to hand. Renaming makes a stale
  # reference fail loudly instead of silently reading a default.
  min_scoped_snapshot_coverage_pct: 80
                                   # SCOPED. Historical snapshots must reach ≥80%
                                   # of the analytics-scoped population for a
                                   # quarter to be usable. Quarters below this
                                   # return null (invalid denominators)

# ============================================================================
# PROPOSAL ENGINE
# ============================================================================
# Self-tuning analysis gate. Analyses can propose methodology changes
# (e.g., anchor week, coverage target) but proposals never auto-apply.
# All proposals require explicit admin approval before taking effect.

proposal_engine:
  enabled: true
  min_evidence_count: 30          # sample size floor before proposing
  min_quarters_of_history: 4      # analyses needing quarter cohorts
  min_effect_size_pct: 10         # suppress sub-10% recommendations
  suppress_duplicate_days: 30     # don't re-propose same entity within N days
  max_open_proposals: 10          # stop-the-noise cap

# ============================================================================
# SEGMENTATION CONFIGURATION
# ============================================================================
# Company-size based segmentation for pipeline generation and in-quarter
# contribution analysis. Enables tracking of different sales cycle lengths
# by segment.

segmentation:
  source: "company"  # Segmentation reads from associated Company object
  field: "numberofemployees"  # HubSpot property on Company object
  bands:
    - name: "SMB"
      max: 250
      expected_cycle_days: 33
      # Small/Medium Business: ≤250 employees, avg 33-day sales cycle

    - name: "Mid-Market"
      min: 251
      max: 2000
      expected_cycle_days: 84
      # Mid-Market: 251-2,000 employees, avg 84-day sales cycle

    - name: "Enterprise"
      min: 2001
      expected_cycle_days: 132
      # Enterprise: 2,001+ employees, avg 132-day sales cycle

    - name: "Unknown"
      expected_cycle_days: null
      # No employee count or no company association - cannot predict cycle

# ============================================================================
# HUBSPOT PIPELINE CONFIGURATION
# ============================================================================
# Use scripts/discover_stages.py to find your organization's stage IDs

# ============================================================================
# PHASE A: New pipeline configuration shape (for analytics layer)
# ============================================================================
# This new shape enables waterfall tracking, conversion analysis, and
# qualification trending. The legacy excluded_stages block below is kept
# for backward compatibility during transition.

pipeline:
  # Analytics configuration
  value_field:
    type: computed
    components: ["new_revenue", "expansion_revenue"]
    # NULL-safe sum: blank components treated as 0.
    # This is GrowthBook's Incremental ARR without the
    # NULL-out hazard of the HubSpot calculated field.
    # Verified: incremental_arr == new_revenue + expansion_revenue for all
    # 1,523 deals where HubSpot populates it (zero disagreements).

    # When EVERY component is blank/null, Incremental ARR is unknown rather
    # than zero, so fall back to amount. Do NOT fall back when a component is
    # present and zero — that is a real value. Without this, 13 default-pipeline
    # deals carrying $920K read as $0.
    fallback: "amount"

    # Renewal deals are Incremental ARR + Renewal ARR: incremental_arr holds
    # only the expansion on top of the renewed base, so renewals without
    # expansion compute to 0 without this. renewal_revenue is HubSpot's
    # "Renewal ARR" — the portion of ACV/ARR renewing existing contracted ARR.
    renewal_components: ["renewal_revenue"]
    renewal_pipeline_ids: ["866608541"]
  qualified_stage_order: 1  # Stages with order >= this are "qualified" (entered pipeline)
  win_rate_qualified_field: "sao"  # Win rate denominator = deals where SAO is true

  # Pipeline definitions with per-stage configuration
  pipelines:
    - id: "default"
      name: "Sales Pipeline"
      qualified_stage_order: 1
      stages:
        # RULE: Disqualified stages get BOTH is_lost=true AND exclude_from_analysis=true
        # Lost stages (is_lost=true) are included in waterfall unless exclude_from_analysis=true

        - id: "79653122"
          name: "Meeting Set"
          order: 0
          stage_probability: 0.05
          exclude_from_analysis: true  # Too early - not qualified yet

        - id: "appointmentscheduled"
          name: "Discovery"
          order: 1
          stage_probability: 0.10

        - id: "qualifiedtobuy"
          name: "Scoping"
          order: 2
          stage_probability: 0.10

        - id: "presentationscheduled"
          name: "Technical Evaluation"
          order: 3
          stage_probability: 0.40

        - id: "24682892"
          name: "Negotiating"
          order: 4
          stage_probability: 0.60

        - id: "43449439"
          name: "Awaiting Signature"
          order: 5
          stage_probability: 0.90

        - id: "closedwon"
          name: "Closed Won (default)"
          order: 6
          stage_probability: 1.0
          is_won: true

        - id: "closedlost"
          name: "Closed Lost (default)"
          order: 7
          stage_probability: 0.0
          is_lost: true

        - id: "decisionmakerboughtin"
          name: "Review"
          order: 8
          stage_probability: 0.50

        - id: "68509551"
          name: "Disqualified"
          order: 9
          stage_probability: 0.0
          is_lost: true
          exclude_from_analysis: true  # Both flags: lost AND excluded

    - id: "866608541"
      name: "Renewal Pipeline"
      analyze: false  # MEDDICC agent skips; analytics INCLUDES for GRR/NRR
      qualified_stage_order: 0
      stages:
        - id: "1297321618"
          name: "Upcoming Renewal"
          order: 0
          stage_probability: 0.75

        - id: "1297321619"
          name: "Renewal Engaged"
          order: 1
          stage_probability: 0.85

        - id: "1297321620"
          name: "Pricing Presented"
          order: 2
          stage_probability: 0.90

        - id: "1297321622"
          name: "Contract Sent"
          order: 3
          stage_probability: 0.95

        - id: "1297321623"
          name: "Closed Won (Renewal)"
          order: 4
          stage_probability: 1.0
          is_won: true

        - id: "1297321624"
          name: "Closed Lost (Renewal)"
          order: 5
          stage_probability: 0.0
          is_lost: true

# ============================================================================
# LEGACY: Backward-compatible excluded_stages configuration
# ============================================================================
# This block is kept for backward compatibility during Phase A transition.
# The new pipeline.pipelines[] shape above takes precedence when both exist.

pipelines:
  # Pipelines to include in active deal analysis
  # Only deals in these pipelines will be analyzed nightly
  included:
    - name: "Sales Pipeline"
      id: "default"

  # Pipelines to exclude from active deal analysis
  # Common: renewal pipelines, partner pipelines, marketing pipelines
  excluded:
    - name: "Renewal"
      id: "866608541"

# ============================================================================
# DEAL STAGE FILTERING
# ============================================================================
# Stages to exclude from active deal analysis
# Common exclusions: too early (meeting set), too late (closed), or disqualified

excluded_stages:
  # Early stages (pre-discovery)
  meeting_set:
    - name: "Meeting Set"
      id: "79653122"
    # NOTE: appointmentscheduled is "Discovery" stage, NOT Meeting Set - do not exclude

  # Disqualified deals
  disqualified:
    - name: "Disqualified"
      id: "68509551"

  # Closed deals (excluded in active mode, included in history mode)
  closed_won:
    - name: "Closed won"
      id: "closedwon"
    - name: "Closed Won"
      id: "1297321623"

  closed_lost:
    - name: "Closed lost"
      id: "closedlost"
    - name: "Closed Lost"
      id: "1297321624"

# ============================================================================
# STAGE PROGRESSION REQUIREMENTS
# ============================================================================
# Minimum MEDDICC component scores required to advance between stages
# Used by evaluator to validate stage recommendations

stage_progression:
  discovery_to_scoping:
    identified_pain: 5
    champion: 4
    minimum_stakeholders: 2

  scoping_to_proposal:
    metrics: 6
    economic_buyer: 6
    champion: 6
    decision_criteria: 5

  proposal_to_negotiating:
    # All components must meet minimum
    all_components_minimum: 6
    decision_process: 7
    competition: 6

  negotiating_to_closed_won:
    # All components must be strong
    all_components_minimum: 8
    decision_process: 7
    # If using MEDDPICC:
    # paper_process: 7

# ============================================================================
# ANALYSIS QUALITY THRESHOLDS
# ============================================================================
# Evaluator pass/fail criteria
# Based on deliverable/rubrics/evaluator-pass-fail-criteria.md

quality_thresholds:
  # Evaluation mode
  # strict: Reject if ANY criterion fails (recommended for initial rollout)
  # standard: Reject if 2+ criteria fail (after 30+ approved analyses)
  # lenient: Reject if 3+ criteria fail (not recommended)
  evaluation_mode: "strict"

  # Minimum quality score to approve (0-100)
  # Calculated from 7 criteria, each weighted
  minimum_quality_score: 70

  # Evidence requirements
  evidence:
    minimum_quotes_for_high_score: 2  # Scores 8+ need 2+ quotes
    maximum_hedging_words: 2  # Max uses of "seems", "appears", "probably"

  # Score justification ranges
  score_ranges:
    strong_identified:  # 9-10: Crystal clear, multiple confirmations
      min: 9
      max: 10
    identified:  # 7-8: Clear evidence, single confirmation
      min: 7
      max: 8
    partial:  # 5-6: Partial info, needs clarification
      min: 5
      max: 6
    weak:  # 3-4: Vague mention, significant gaps
      min: 3
      max: 4
    unknown:  # 1-2: Not discussed or unknown
      min: 1
      max: 2

# ============================================================================
# DEAL HEALTH CALCULATION
# ============================================================================
# Rules for determining overall deal health status

deal_health:
  strong:
    minimum_components_above_6: 5  # Need 5+ components scoring 6+
    minimum_champion_score: 5

  at_risk:
    # Deal is at risk if ANY of these conditions are true
    critical_components_below_5: ["champion", "economic_buyer"]
    components_below_5_count: 3  # 3+ components below 5
    champion_score_below: 5

# ============================================================================
# TOKEN BUDGET & MODEL SELECTION
# ============================================================================
# Control costs and performance

# ==========================================================================
# MODEL SELECTION
# Changing name/provider here is all that's needed to switch providers.
# No code changes required.
#
# Supported providers:
#   anthropic  — Claude models (default)
#   openai     — GPT models via api.openai.com (needs OPENAI_API_KEY)
#   fireworks  — Any model via fireworks.ai (needs FIREWORKS_API_KEY)
#
# Fireworks model strings use the format:
#   "accounts/fireworks/models/deepseek-v3"
#   "accounts/fireworks/models/kimi-k2"
# ==========================================================================
models:
  context_builder:
    name: "claude-haiku-4-5-20251001"
    provider: "anthropic"
    max_tokens: 16000

  generator:
    name: "claude-sonnet-4-6"
    provider: "anthropic"
    max_tokens: 8000
    fallback_to_anthropic: false
    parallel_workers: 3  # How many deals to process in parallel
                         # Anthropic: keep at 3 (rate limit ~50 req/min)
                         # Fireworks: 8-15 is safe (rate limit ~600 req/min)
                         # OpenAI: 5-8 depending on tier
    # Fireworks DeepSeek V4 Pro (94% cheaper output, validate quality first):
    #   name: "accounts/fireworks/models/deepseek-v4-pro"
    #   provider: "fireworks"
    # Budget alternative - V4 Flash (faster, cheaper):
    #   name: "accounts/fireworks/models/deepseek-v4-flash-0731"
    # Qwen 3.8 Max (excellent structured output):
    #   name: "accounts/fireworks/models/qwen3p8-max"
    # OpenAI GPT-4o:
    #   name: "gpt-4o"
    #   provider: "openai"

  evaluator:
    name: "claude-haiku-4-5-20251001"
    provider: "anthropic"
    max_tokens: 4000

  classifier:
    name: "claude-haiku-4-5-20251001"
    provider: "anthropic"
    max_tokens: 500

  assessor:
    name: "claude-haiku-4-5-20251001"
    provider: "anthropic"
    max_tokens: 200

  enrichment:
    name: "claude-haiku-4-5-20251001"
    provider: "anthropic"
    max_tokens: 2000
    # Budget alternative for enrichment (85% cheaper input):
    #   name: "accounts/fireworks/models/kimi-k2"
    #   provider: "fireworks"

# ============================================================================
# CALL INTELLIGENCE PLATFORM
# ============================================================================
# Configure which call recording platform to use for transcript extraction
# Supported: fireflies, gong

call_tools:
  # Primary call intelligence platform
  # Options: 'fireflies' (Fireflies.ai) or 'gong' (Gong.io)
  primary: "fireflies"

# ============================================================================
# CALL SOURCES (Source-Agnostic Factory)
# ============================================================================
# Configure active conversation intelligence sources and deduplication priority.
# Used by get_call_sources() factory to instantiate adapters in priority order.
#
# Priority list determines which source wins when multiple sources return calls
# for the same deal/date. First source in list = highest priority.
#
# GrowthBook: [fireflies, apollo] preserves existing deduplicate_calls_prefer_fireflies
# behavior where Fireflies summaries (full AI summaries) are preferred over Apollo's
# weaker summaries (video meetings platform, not conversation intelligence recorder).

call_sources:
  primary: fireflies      # Main conversation intelligence source
  dialer: apollo          # Secondary source (video meetings)
  priority: [fireflies, apollo]  # Dedup order: Fireflies wins over Apollo

# ============================================================================
# SDR TOOLS (OPTIONAL)
# ============================================================================
# Configure which SDR activity tools to sync for call/email metrics
# Used by scripts/etl_sdr_metrics.py and api/handlers.py

sdr_tools:
  # Apollo.io dialer - LIMITED metrics only
  # ✅ Provides: calls_made, voicemails (voicemail_dropped field)
  # ❌ Does NOT provide: connect_rate (no answered/connected signal in API)
  # ⚠️  Dispositions often missing (phone_call_outcome_id is null ~30%+ of records)
  # For full SDR metrics (connect rate, talk time), use Salesloft or Aircall
  apollo:
    enabled: true  # Enabled for dry-run testing

  # Salesloft sequencer - FULL metrics (calls + emails)
  # ✅ Provides: calls_made, connected_calls, connect_rate, voicemails,
  #             emails_sent, email_opens, email_replies, open/reply rates
  # Best for teams using Salesloft Cadence for both email and call outreach
  salesloft:
    enabled: false

  # Aircall dialer - FULL call metrics only
  # ✅ Provides: calls_made, connected_calls, connect_rate, voicemails,
  #             dispositions, talk_time
  # ❌ Does NOT provide: email metrics
  # Best for teams using Aircall as standalone dialer
  aircall:
    enabled: false

  # Pipeline attribution configuration
  # Determines which HubSpot field to use for tracking SDR-sourced deals
  pipeline_attribution:
    method: "sdr_field"           # sdr_field | current_owner
    sdr_field: "bdr_owner"        # HubSpot internal property name
                                  # Common values by team:
                                  #   "bdr_owner"     (GrowthBook)
                                  #   "sdr_owner"
                                  #   "sourced_by"
                                  #   "original_owner"
                                  # If blank or absent: falls back to current_owner

# ============================================================================
# ETL CONFIGURATION
# ============================================================================
# Settings for nightly deal and call ingestion

etl:
  # Deal properties to fetch from HubSpot
  # Add custom properties your organization uses
  deal_properties:
    - dealname
    - dealstage
    - pipeline
    - closedate
    - amount
    - incremental_arr
    - hubspot_owner_id
    - createdate
    - hs_lastmodifieddate
    # Add your custom properties here:
    # - custom_priority_score
    # - industry_vertical

  # Refresh frequency
  active_deals_refresh: "nightly"  # How often to refresh active deal list
  call_lookback_days: 90  # How far back to look for calls

# ============================================================================
# CUSTOMIZATION NOTES
# ============================================================================
#
# To customize this for your organization:
#
# 1. Run scripts/discover_stages.py to get your HubSpot stage IDs
# 2. Update pipelines.excluded with your renewal/partner pipelines
# 3. Update excluded_stages with your organization's stage names and IDs
# 4. Adjust stage_progression thresholds based on your sales process
# 5. Set evaluation_mode to "strict" for initial rollout
# 6. Add custom deal_properties you want to include in analysis
#
# See README.md for detailed setup instructions.

