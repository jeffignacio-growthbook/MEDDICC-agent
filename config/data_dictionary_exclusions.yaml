# Data-dictionary registration exclusions.
#
# Same idea as the '# ALLOW-RAW-DATE-MATH:' comment marker used for the
# date-resolution gate (tests/test_date_resolution_single_source.py): a
# column that is deliberately NOT registered in the data_dictionary table
# must be listed here, with a real reason, rather than silently missing.
#
# Background (2026-09-11): deals_snapshot.region and deals_snapshot.segment
# existed in Postgres and were fully populated for days before anyone
# noticed they were invisible to the dynamic query loop — because
# visibility is controlled ENTIRELY by data_dictionary rows, not by the
# real Postgres schema, and registering a new column there is a separate,
# skippable step from the migration that adds it. This file plus
# scripts/check_data_dictionary_coverage.py make that step structurally
# unskippable for deals, deals_snapshot, and waterfall_weekly going
# forward: every column on those tables must appear either in
# data_dictionary (is_queryable true or false) or in this file.
#
# Format: one entry per intentionally-excluded (table, column) pair.
#
# excluded:
#   - table: deals_snapshot
#     column: some_internal_column
#     reason: "Internal bookkeeping column, never meant to be queryable."
#
# NOTE ON HISTORY: this file does not yet enumerate the many columns added
# to these three tables before migration 062 — most of those were
# registered directly against the live database via
# scripts/backfill_data_dictionary.py, which leaves no trace in the
# migrations folder, so a static read of this repo cannot tell which of
# them are genuinely covered. scripts/check_data_dictionary_coverage.py's
# live mode (real Supabase credentials) is the actual source of truth for
# the full historical picture; the offline structural gate
# (tests/test_data_dictionary_registration.py) only enforces this rule for
# migrations added after 062, so it can't retroactively flag decades of
# history it has no way to verify. Once the live check has been run
# against the real database, add any genuinely-intentional historical gaps
# it finds here, backed by an actual answer from that run — not a guess.

excluded:
  # sdr_metrics - internal/housekeeping columns
  - table: sdr_metrics
    column: id
    reason: "Primary key - internal database ID, not queryable business data"
  - table: sdr_metrics
    column: tool_user_id
    reason: "External system user ID (Apollo/Salesloft internal ID), not queryable - use user_name instead"
  - table: sdr_metrics
    column: etl_run_at
    reason: "ETL timestamp - internal housekeeping, not queryable business data"

  # sdr_users - internal/housekeeping columns
  - table: sdr_users
    column: id
    reason: "Primary key - internal database ID, not queryable business data"
  - table: sdr_users
    column: internal_user_id
    reason: "Internal system user ID mapping, not queryable - use user_email instead"
  - table: sdr_users
    column: tool_user_id
    reason: "External system user ID (Apollo/Salesloft internal ID), not queryable - use user_name instead"
  - table: sdr_users
    column: first_seen
    reason: "ETL tracking timestamp - when user first appeared in tool data, not queryable business data"
  - table: sdr_users
    column: last_seen
    reason: "ETL tracking timestamp - when user last appeared in tool data, not queryable business data"

  # user_personas - ALL columns are internal bot configuration, not queryable sales data
  # This table configures how the Slack bot formats responses based on user role/preferences
  # Organizational data (who's on the sales team) should come from deals.owner_email or rep_targets, not bot config
  - table: user_personas
    column: id
    reason: "Primary key - internal database ID"
  - table: user_personas
    column: email
    reason: "User email - bot config lookup key, not queryable sales data (use deals.owner_email for team queries)"
  - table: user_personas
    column: name
    reason: "User name - bot config, not queryable sales data (use rep_targets.entity_name for team queries)"
  - table: user_personas
    column: display_name
    reason: "Bot UI display name - internal formatting config"
  - table: user_personas
    column: slack_user_id
    reason: "Slack-specific user ID - internal bot routing, not queryable business data"
  - table: user_personas
    column: role
    reason: "User job role - bot config for response formatting, not queryable sales data"
  - table: user_personas
    column: role_group
    reason: "Role grouping (sales/cs/ops) - bot config for response formatting"
  - table: user_personas
    column: title
    reason: "Job title - bot config, not queryable sales data"
  - table: user_personas
    column: persona
    reason: "Bot persona type (executive/operational/IC) - internal response formatting config"
  - table: user_personas
    column: preferred_detail_level
    reason: "User preference for response verbosity - bot config"
  - table: user_personas
    column: wants_metrics_context
    reason: "User preference flag - bot config"
  - table: user_personas
    column: source
    reason: "Registration source tracking - internal housekeeping"
  - table: user_personas
    column: registered_at
    reason: "Registration timestamp - internal housekeeping"
  - table: user_personas
    column: last_seen_at
    reason: "Activity timestamp - internal housekeeping"
  - table: user_personas
    column: updated_at
    reason: "Record update timestamp - internal housekeeping"
