      pct_of_total_wins: 30.6  # 22/72 precisely
      pct_of_missing: 48.9  # 22/45 precisely
      definition: deals with deal_status='won' from creation, never
        observed in deal_status='active' during any snapshot
      characteristics:
        - ALL have deal_status='won' (100%)
        - Long cycles (14-90 days) but not in ANY snapshot
        - Not in any pipeline (checked via pipeline migration analysis)
      source_investigation:
        fields_checked: [hs_object_source, hs_object_source_id, 
          hs_object_source_label, hs_created_by_user_id, hs_created_by]
        result: No systematic source found for GrowthBook
        pattern: Scattered manual/backdated entries, not a single
          integration or bulk import
        note: Recompute this check per client; do not assume the same
          conclusion transfers
      disposition: not fixable via process change (GrowthBook) — accept
        as permanent characteristic and report as a separate line item,
        not folded into prospective conversion rate

    data_quality_errors:
      count: 8
      pct_of_total_wins: 11.1  # 8/72 precisely
      pct_of_missing: 17.8  # 8/45 precisely
      definition: 0-day or negative create-to-close cycles
      examples:
        - "Quizlet: 0 day cycle (2026-01-15 → 2026-01-15)"
        - "Make: -41 day cycle (closed before created)"
        - "Bluesky: 0 day cycle (2026-01-12 → 2026-01-12)"
      disposition: exclude from all rate calculations; flag for cleanup

    fast_track_short_cycle:
      count: 7
      pct_of_total_wins: 9.7  # 7/72 precisely
      pct_of_missing: 15.6  # 7/45 precisely
      definition: deals under 14 day cycle that fall between weekly
        snapshot intervals
      examples:
        - "InMobi: 12 day cycle"
        - "Oda: 11 day cycle"
        - "lendable: 2 day cycle"
      disposition: accept as edge case; do not increase snapshot
        frequency solely to capture this population unless volume grows

    excluded_stages:
      count: 5
      pct_of_total_wins: 6.9  # 5/72 precisely
      pct_of_missing: 11.1  # 5/45 precisely
      definition: deals that were in excluded stages (Meeting Set,
        Review, Disqualified) during weeks 1-13, then qualified and
        closed after the quarter-end snapshot window
      examples:
        - "Deals in 'Meeting Set' stage during entire snapshot window"
        - "Deals in 'Review' stage that later moved to qualified"
      disposition: accept as limitation; these deals never appeared
        in qualified stages during the measurement window

    carry_over:
      count: 3
      pct_of_total_wins: 4.2  # 3/72 precisely
      pct_of_missing: 6.7  # 3/45 precisely
      definition: deal created in a prior quarter, closed in the
        analyzed quarter, only present in prior quarter's snapshots
      examples:
        - "Fellow: Created 84 days before Q3 start"
        - "Yeet!: Created 5 days before Q4 start"
        - "Wellhub: Created 1 day before Q1 start"
      disposition: fixable — implement cross-quarter snapshot lookup
        when computing qualification_week for deals near a quarter boundary

  recommended_reporting:
    prospective_conversion: "27/376 = 7.2% (deals tracked in snapshots)"
    total_wins: "72 (includes all categories above)"
    retroactive_wins_separate_line: "22 (30.6% of total)"
    note: "Do not blend retroactive wins into conversion rate denominator"

known_infrastructure_notes:
  pagination:
    issue: PostgREST 1000-row limit
    impact: >
      All deals_snapshot queries spanning more than ~1000 rows (i.e. any
      multi-week or multi-quarter query) MUST use
      scripts/utils/pagination.py:fetch_all_rows_by_filters(). Direct
      Supabase queries without pagination will silently truncate at 1000
      rows with no error.
    
    original_impact: >
      This caused a systemic undercount across every multi-week analysis
      in the original GrowthBook build. Before fix:
      - Q3 all-weeks: 3,017 actual rows, 1,000 fetched (67% missing)
      - Q4 all-weeks: 5,382 actual rows, 1,000 fetched (81% missing)
      - Q1 all-weeks: 5,697 actual rows, 1,000 fetched (82% missing)
    
    resolution: >
      Pagination utility created with support for .eq(), .gte(), .lte(),
      .gt(), .lt(), .in_(), .is_() filters. Verify this utility is
      imported before writing any new cross-week query.
    
    verification: >
      After pagination fix, Q1 analysis found 167 qualified deals (vs 70
      before), 11 wins (vs 5 before). The "snapshot grid gap" was
      actually a pagination bug - all weeks 1-13 exist for all quarters.

  snapshot_grid_completeness:
    status: COMPLETE
    verified_quarters:
      FY2026_Q3:
        weeks: "1-13"
        total_rows: 3017
      FY2026_Q4:
        weeks: "1-13"
        total_rows: 5382
      FY2027_Q1:
        weeks: "1-13"
        total_rows: 5697
    
    false_alarm: >
      Initial claim that "Q3 has only weeks 1-2, Q4 missing weeks 1-3" was
      due to pagination bug, not missing data. All snapshot weeks exist.
    
    documentation: >
      See PAGINATION_BUG_INVESTIGATION_SUMMARY.md for complete investigation
      record and FINAL_45_MISSING_WINS_ROOT_CAUSES.md for deal population
      analysis.

  deal_status_filtering:
    snapshot_job_behavior: >
      The snapshot job captures deals in their current deal_status at
      snapshot time. Deals that were NEVER in deal_status='active' during
      weeks 1-13 will not appear in any snapshot, even if they have long
      create-to-close cycles.
    
    retroactive_entry_pattern: >
      Deals entered with deal_status='won' from creation (backdated
      timestamps) skip all snapshots because they never had an 'active'
      state when snapshots ran. This is a data entry pattern, not a
      snapshot job bug.
    
    implication: >
      Prospective conversion tracking only works for deals that progress
      through normal pipeline stages while active. Retroactive wins must
      be tracked separately.

cycle_time:
  label: Sales Cycle Time (Days from Create to Close)
  formula: MEDIAN((close_date - create_date).days) WHERE days >= 0
  population: won, non-renewal deals only
  basis: days
  freshness: dynamic  # recalculated on each query

  # Configuration
  config:
    window_mode: "all_time"  # Options: "all_time", "rolling" - CHANGED to all_time due to small sample
    rolling_window_months: 12  # Used when window_mode = "rolling"
    min_sample_size: 20  # Minimum deals required for reliable metric
    fallback_to_all_time: true  # If rolling window < min_sample_size, use all_time

  # Methodology
  computation_spec:
    population:
      status_filter: won deals only (is_won(stage) = true)
      pipeline_filter: NON-RENEWAL ONLY (pipeline_id != '866608541')
      rationale: |
        1. Lost deals stall for reasons unrelated to sales velocity - exclude
        2. CRITICAL: Renewal deals excluded - renewal create_date does not
           represent sales cycle start. Renewals are often created at initial
           close, then sit dormant for contract duration (500-700+ days).
        3. Renewal cycle time is a separate metric, requires different start
           point (e.g., renewal_engaged_date, not create_date)
    date_fields:
      start: create_date (full timestamp, not date-only)
      end: close_date (full timestamp)
      calculation: (close_date - create_date).days
    filter: days >= 0  # Exclude negative/bad data (not > 0)
    aggregation: MEDIAN (not mean - robust to outliers)
    window:
      all_time: All won deals in database
      rolling: "Deals closed within last N months (config: rolling_window_months)"
      cutoff_calculation: "now - timedelta(days=rolling_window_months * 30)"

  # Verified Values (CORRECTED - Renewals Excluded as of 2026-09-06)
  verified:
    as_of: "2026-09-06"
    contamination_fix: |
      Previous values (116/156.5/158 days) were CONTAMINATED with renewal deals
      (80% of population, 91 of 113 deals). Renewal create_date != cycle start.
      Values below are CORRECTED (non-renewal only).

    all_time:
      median_days: 52
      sample_size: 22
      distribution:
        p25: 21
        p50: 52
        p75: 91
        min: 0
        max: 354
    rolling_12_month:
      median_days: 56
      sample_size: 14
      distribution:
        p25: 12
        p50: 56
        p75: 91
        min: 0
        max: 188
      warning: "Sample < 20 threshold - may not be reliable"
    rolling_6_month:
      median_days: 56
      sample_size: 12
      distribution:
        p25: 21
        p50: 56
        p75: 117
        min: 5
        max: 188
      warning: "Sample < 20 threshold - may not be reliable"

    # Current configuration choice
    current_config: "all_time"  # Changed from rolling due to small sample
    current_value: 52

    trend_insight: |
      NO lengthening trend detected. All windows cluster around 52-56 days.
      Previous false "trend" (116→157 days) was 100% due to renewal contamination.
      Quarter-by-quarter analysis shows high variance (1-8 deals per quarter) but
      no monotonic increase. Average recent 6 quarters: 48 days.

    recommendation: |
      ALL-TIME window (52 days, 22 deals) recommended:
      1. No evidence of trend - rolling windows add no value (all ~56 days)
      2. Sample sizes below 20 threshold for rolling windows (14, 12 deals)
      3. All-time provides largest sample (22 deals) for stability
      4. GrowthBook has very few non-renewal wins - all data needed for reliability

  # Fallback Logic
  fallback_behavior: |
    If window_mode="rolling" and sample_size < min_sample_size:
    - Fall back to all_time window
    - Include note in response: "Insufficient recent data (N deals), using all-time window"
    - This prevents volatility from small samples while surfacing data limitation

  # Historical Context
  contamination_discovery:
    date: "2026-09-06"
    finding: |
      Original cycle_time included renewal pipeline deals (pipeline_id='866608541').
      Renewals comprised 80% of "won deals" (91 of 113). Renewal create_date does
      not represent sales cycle start - often created at initial close, then sit
      for contract duration before renewal. Top 5 longest "cycles" (500-740 days)
      were ALL renewals.

    contaminated_values:
      all_time: "116 days (113 deals)"
      rolling_12mo: "156.5 days (72 deals)"
      rolling_6mo: "158 days (47 deals)"

    corrected_values:
      all_time: "52 days (22 deals)"
      rolling_12mo: "56 days (14 deals)"
      rolling_6mo: "56 days (12 deals)"

    impact: "64-102 day inflation from renewal contamination"

  # Population Validation (2026-09-06)
  population_validation:
    date: "2026-09-06"
    trigger: |
      Cross-metric plausibility check flagged 22 non-renewal won deals (19% of wins)
      against already-verified 306 active non-renewal deals (69% of active pipeline).
      3.6x divergence required investigation before finalizing population.

    investigation_phases:
      phase_1_lost_deals_sample:
        script: investigate_lost_deals.py
        finding: "April 2026 bulk close-lost event (235 deals, 38.8% of losses)"
        pattern: "100% blank lost_reason - admin cleanup, not sales feedback"

      phase_2_pipeline_classification:
        script: investigate_pipeline_ids.py
        finding: "Pipeline scheme changed in 2023 - renewal pipeline introduced"
        win_rates:
          default_pipeline: "3.7% (23/629) - suspiciously low"
          renewal_pipeline: "90.7% (98/108) - normal for renewals"

      phase_3_default_segmentation:
        script: segment_default_pipeline.py
        finding: "Default pipeline is MIXED (real business + bulk cleanup + pre-2023)"
        validation:
          - "115 active default deals with $7M incremental ARR (Tubi, dentsu, etc.)"
          - "All 23 won deals have real ARR (genuine wins)"
        cleaned_win_rate: "6.0% (after excluding April 2026 bulk + pre-2023)"
        status: "Still below expected 15-30% range"

      phase_4_organic_losses_deep_dive:
        script: investigate_organic_losses.py
        breakthrough: "Found 9 additional bulk cleanup months beyond April 2026"
        pattern: "All organic losses had blank lost_reason (100%)"
        additional_contamination: "239 deals across 9 months (>10 blank lost_reason/month)"
        months: "2023-08, 2024-11, 2026-01, 2026-02, 2026-03, 2026-05, 2026-06, 2026-07, 2026-08"

    final_result:
      script: final_corrected_win_rate.py
      total_contamination: "496 deals (81.8% of lost deals)"
      breakdown:
        april_2026_bulk: 235
        pre_2023_deals: 22
        additional_bulk_cleanup: 239
      truly_organic_losses: 122
      final_win_rate: "15.9% (23 won / 145 closed)"
      status: "✅ Within expected 15-30% range"
      conclusion: "Default pipeline is LEGITIMATE NEW BUSINESS PIPELINE"

    cross_metric_validation:
      initial_finding:
        active_incremental: "50.4% (58/115 active default deals)"
        historical_incremental: "100.0% (23/23 clean cohort won deals)"
        divergence: "49.6 percentage points"
        status: "🚩 BLOCKED - mix shift explanation did NOT hold"

      investigation:
        script: investigate_active_pipeline_classification.py
        root_cause: "Stage composition difference (not data quality issue)"
        breakdown:
          incremental: "58 deals (50.4%)"
          renewal_only: "1 deal (0.9%)"
          uncategorized_no_arr: "56 deals (48.7%)"
        finding: |
          All 56 uncategorized deals are in stage 79653122 ("Meeting Set" - discovery).
          Early-stage deals naturally lack ARR values (not yet proposed).
          This is EXPECTED BEHAVIOR, not a data quality gap.

      corrected_comparison:
        description: "Like-for-like: Active post-discovery vs Historical won"
        active_post_discovery: "98% incremental (58/59 deals past discovery stage)"
        historical_won: "100% incremental (23/23 closed-won deals)"
        divergence: "2 percentage points"
        status: "✅ ACCEPTABLE - within reasonable noise"

      temporal_comparison_limitation:
        accepted_simplification: |
          The 98% vs 100% comparison is snapshot-in-time (active pipeline today)
          vs all-time (historical won deals 2023+), not a fully like-for-like
          temporal match.

          This is an accepted simplification:
          - 2pp residual gap is within reasonable noise
          - Much smaller than stage-composition issue (resolved above)
          - Does not warrant further investigation

          Documented explicitly (not silently assumed away), consistent with
          other approximations:
          - Signal 2's updated_at proxy for last_activity_date
          - Signal 3's 67% call-data coverage

          Future refinement: Could compare active post-discovery deals created
          in same date range as historical won deals (2023+), but complexity
          not justified for 2pp gap.

      final_status: "✅ PASS - stage composition explains divergence, temporal gap accepted"

    template_portable_pattern: |
      This investigation pattern applies to ALL clients:

      1. Before finalizing any population metric:
         - Run cross-metric plausibility check (mandatory gate)
         - Compare against adjacent verified metrics
         - Flag if >20pp divergence or >2x ratio

      2. If win rate is suspiciously low (<10%):
         - Sample lost deals for blank lost_reason
         - Check month-by-month distribution for bulk events
         - Exclude bulk cleanup (>10 deals/month, blank lost_reason)

      3. If business mix diverges between active and historical:
         - Document as potential business shift
         - Don't assume it's a bug - could be genuine pivot
         - Monitor over time to confirm

  prior_values:
    original_yaml:
      value: 159
      date: "~2026-03-05 to 2026-09-05"
      method: "Won only, 6-month window (CONTAMINATED - included renewals)"
      sample_size: 48
      note: "Was close to contaminated 6-month (158d) but both were methodologically wrong"

  # Usage Note
  usage_note: |
    This metric is template-portable. Other clients should:
    1. Choose window_mode based on sales motion stability
    2. Adjust rolling_window_months based on deal volume
    3. Validate min_sample_size threshold for their data density
    4. Consider separate metrics for different segments if cycle times vary widely
