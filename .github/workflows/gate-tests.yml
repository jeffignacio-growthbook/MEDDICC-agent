name: Pre-Merge Gate Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
        default: 'main'
      run_smoke:
        description: 'Run TEST 3, the live 8-question smoke test against Railway (posts to Slack). Off by default; turn on only when validating a deploy.'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  gate-tests:
    runs-on: ubuntu-latest
    environment: Agent
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "TEST 0 — Offline: greeting/help handler + handler descriptions"
        run: |
          set -e
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_help_handler.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_handler_descriptions.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_slip_diagnosis.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_query_deal_stages_bulk.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_rubric_scores_bulk.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_handlers_no_raise.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_fallback_message.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_intent_param_contract.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_meddicc_score_presentation.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_scoring_pipeline.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_stage_score_hygiene.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_evidence_contract.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_score_correction.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_scoring_bands.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_transcript_store.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_evaluator_json_salvage.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_score_pinning.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_force_reanalyze.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_per_call_rollup.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_rollup_render.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_snapshot_precutover.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_score_new_calls.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_bestseller_incident.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_multicompany_entity_scope.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_component_evidence.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_synthesis_style.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_synthesis_evidence_first.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_requirements_complete.py

      - name: "TEST 0b — Offline: forecast analytics correctness (the 5 defects)"
        run: |
          set -e
          # Behavioral (fixture-computed) coverage of the forecast analytics
          # defects — in-quarter numerator, unfiltered denominator, shared scope,
          # null-value propagation (util + in situ), point-in-time stage — plus
          # the null-coalescing ratchet. These previously ran ONLY in the
          # dispatch-only forecast-correctness workflow, so a regression that
          # produced 196-vs-31 or 110% conversion wasn't caught on a normal PR.
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/test_forecast_analyses.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_forecast_correctness.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_reconstruction.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_waterfall_null_insitu.py

      - name: "TEST 0c — Offline: date/time-window resolution (single-source-of-truth gate)"
        run: |
          set -e
          # Structural gate for the 2026-09-10 date-window incident class:
          # resolve_time_window() must be the ONLY place "today" or a
          # relative time span gets converted to concrete dates anywhere in
          # api/. Fails the build the moment a new parallel implementation
          # (a bare date.today(), or unrouted/unmarked timedelta(days=...)
          # math) is added, instead of waiting for a fourth live follow-up
          # question to find it. See test_date_resolution_single_source.py
          # for the full incident history this closes.
          PYTHONPATH=. python3 tests/test_date_resolution_single_source.py
          PYTHONPATH=. python3 tests/test_time_window_resolution.py
          PYTHONPATH=. python3 tests/test_snapshot_anchors.py

      - name: "TEST 0d — Offline: dynamic-loop budget shortcuts (enrichment lookup + schema visibility)"
        run: |
          set -e
          # 2026-09-11 budget-exhaustion fix: a snapshot-diff question still
          # blew the token budget on a genuinely-needed third call because
          # (a) deals_snapshot.region/segment existed in Postgres but were
          # never registered in data_dictionary, so the model believed they
          # didn't exist and fell back to a full re-query of deals, and
          # (b) even a truly unavoidable ID-scoped enrichment call (company
          # name for already-matched deal_ids) fell through to a fresh
          # full-budget loop iteration instead of synthesizing immediately.
          PYTHONPATH=. python3 tests/test_schema_context_snapshot_visibility.py
          PYTHONPATH=. python3 tests/test_enrichment_shortcut.py

      - name: "TEST 0e — Offline: data-dictionary registration gate (new migrations)"
        run: |
          set -e
          # Same pattern as the date-resolution gate, for a different bug
          # class: deals_snapshot.region/segment existed in Postgres and
          # were fully populated for days while being completely invisible
          # to the dynamic query loop, because registering a new column in
          # data_dictionary is a separate, skippable step from the
          # migration that adds it — and it got skipped. This is forward-
          # looking only (new migrations past 062); the full historical
          # picture needs live credentials, see TEST 1b below.
          PYTHONPATH=. python3 tests/test_data_dictionary_registration.py

      - name: "TEST 1 — Competitive intel handler against real data"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        continue-on-error: true
        run: |
          cat <<'EOF' > /tmp/test1.py
          import asyncio, sys, json
          sys.path.insert(0, '.')
          from api.db import get_supabase
          from api import handlers
          from api.time_resolver import resolve_time_window
          sb = get_supabase()
          tw = resolve_time_window({'period': 'current_quarter'})
          async def t():
              r = await handlers.query_competitive_intel(
                  {'time_window': tw}, sb)
              print('Competitor counts:', r['competitor_counts'])
              print('Build-vs-buy objections:',
                    len(r['build_vs_buy_objections']))
              for o in r['build_vs_buy_objections'][:3]:
                  print(' ', o.get('company_name'),
                        '|', o.get('verbatim_quote','')[:60])
              print('Low comp score deals:',
                    len(r['low_competition_score_deals']))
          asyncio.run(t())
          EOF
          python3 /tmp/test1.py

      - name: "TEST 1b — Data-dictionary coverage (deals/deals_snapshot/waterfall_weekly)"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          PYTHONPATH=.:scripts python3 scripts/check_data_dictionary_coverage.py
        # Deliberately NOT continue-on-error: the whole point (per the
        # 2026-09-11 deals_snapshot.region/segment incident) is that this
        # class of gap must be structurally unskippable, not another soft-
        # fail check nobody looks at. Requires the SUPABASE_DB_URL secret
        # (a direct Postgres connection string — see backfill-call-
        # scores.yml for the existing precedent) in this workflow's `Agent`
        # environment; if it isn't set yet, this step fails until it is —
        # that's a configuration gap to close, not a reason to soften the
        # gate.

      - name: "TEST 2 — Handler generator dry run"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: |
          python scripts/handler_generator.py --dry-run --days 30

      # Opt-in: this is the only test that hits the live Railway service and
      # posts to Slack (via the Deal Intelligence Zap). Off by default so
      # routine gate dispatches don't post; set run_smoke=true when validating
      # a deploy. Channel comes from the SMOKE_TEST_CHANNEL repo var (a real
      # sandbox channel) — the script's default is an inert sandbox marker, so
      # an unset var still cannot land in a production channel.
      - name: "TEST 3 — Full smoke test (8 questions)"
        if: ${{ inputs.run_smoke == 'true' }}
        env:
          RAILWAY_URL: ${{ secrets.RAILWAY_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMOKE_TEST_CHANNEL: ${{ vars.SMOKE_TEST_CHANNEL || 'sandbox-smoke-test' }}
        continue-on-error: true
        run: |
          python scripts/smoke_test.py --verbose
