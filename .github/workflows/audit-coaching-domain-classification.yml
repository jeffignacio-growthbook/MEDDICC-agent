name: Audit Coaching Domain Classification (one-off)

# One-off diagnostic workflow, not part of the regular gates. READ-ONLY,
# Supabase only.
#
# Verifies whether participant_domains/is_internal (the E.3 Fireflies/
# Apollo call-resolution work) actually provides a per-speaker internal/
# external classification usable for Criterion C's redesign, before
# wiring it into anything.
#
# Report only. No primitive is designed or built here. Safe to delete
# once this one-time audit is done.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: Agent
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Audit coaching domain classification"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          PYTHONPATH=.:scripts:api python3 scripts/audit_coaching_domain_classification.py
