name: "One-off: backfill objections on remaining unscanned calls"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: Agent
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run objection extraction on remaining unscanned calls
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/enrichment/extract_objections.py --limit 50 --yes

      - name: Category breakdown after backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cat <<'EOF' > /tmp/check_categories.py
          import os, sys
          from collections import Counter
          sys.path.insert(0, 'scripts')
          from supabase import create_client
          from supabase_client import select_all
          sb = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SERVICE_KEY'])
          rows = select_all(sb, 'objections', columns='category,company_name,verbatim_quote')
          counts = Counter(r['category'] for r in rows)
          print("Category breakdown (all objections):")
          for cat, n in counts.most_common():
              print(f"  {cat}: {n}")
          bvb = [r for r in rows if r['category'] == 'build_vs_buy']
          print(f"\nbuild_vs_buy total: {len(bvb)}")
          for r in bvb:
              print(f"  - {r['company_name']}: {(r.get('verbatim_quote') or '')[:100]}")
          EOF
          python3 /tmp/check_categories.py
