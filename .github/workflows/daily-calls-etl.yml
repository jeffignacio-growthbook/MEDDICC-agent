name: Daily Calls ETL

on:
  schedule:
    # Run daily at 1:30 AM UTC (after deal ETL at 1 AM, before nightly run at 2 AM)
    - cron: '30 1 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  FIREFLIES_API_KEY: ${{ secrets.FIREFLIES_API_KEY }}
  APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

permissions:
  contents: write  # Allow committing and pushing

jobs:
  etl-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # ETL can take 60-90 minutes
    environment: Agent  # Use Agent environment for secrets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for cache management

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run incremental calls ETL
        run: |
          cd $GITHUB_WORKSPACE
          python scripts/etl_calls.py --mode incremental
        continue-on-error: false

      - name: Backfill Fireflies participants
        run: |
          cd $GITHUB_WORKSPACE
          python scripts/enrichment/fireflies_participants.py --only-new --yes
        continue-on-error: false

      - name: Backfill Apollo participants
        run: |
          cd $GITHUB_WORKSPACE
          python scripts/enrichment/apollo_participants.py --only-new --yes
        continue-on-error: false

      - name: Resolve calls to deals
        run: |
          cd $GITHUB_WORKSPACE
          python scripts/enrichment/resolve_calls.py --only-unresolved --yes
        continue-on-error: false

      # Progressive scoring (PROGRESSIVE_SCORING_SPEC Phase 5b): score the new
      # calls resolved above into call_scores so the roll-up is current each
      # morning. Only new calls are scored (prior rolled state reused); a
      # back-dated call triggers a per-deal re-fold. Non-fatal — a scoring hiccup
      # must not fail the ETL; the backfill reconciles any gap.
      - name: Score new calls (progressive)
        run: |
          cd $GITHUB_WORKSPACE
          python scripts/score_new_calls.py
        continue-on-error: true

      - name: Commit updated call cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add memory/calls/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update call cache [skip ci]"
            git pull --rebase origin main || {
              git rebase --abort
              git pull origin main --no-rebase -X ours
            }
            git push
          fi

      - name: Upload cache artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: call-cache-${{ github.run_number }}
          path: memory/calls/*.json
          retention-days: 7

      - name: Alert on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python scripts/alert_etl_failure.py \
            --job "${{ github.job }}" \
            --run-id "${{ github.run_id }}"
