# Field semantics — the single source of truth for what fields MEAN.
# Client-specific. Template deployments override this file; no code changes.
#
# stage_map: HubSpot stage IDs → canonical meaning + pipeline bucket.
#   The bucket (discovery|scoping|proposal|closed) is what handlers
#   reason about. The stage_id is what lives in the deals.stage column.

# ============================================================================
# FORECAST SEMANTICS
# ============================================================================
# Forecast means Incremental ARR — new_arr + expansion_arr.
#
# Renewal base value (renewal_revenue) is NEVER included in forecast;
# it belongs to GRR and NRR metrics. A renewal deal contributes to forecast
# ONLY through its expansion component (expansion_arr).
#
# This prevents producing combined forecast numbers that include renewal base,
# which would overstate what reps are actually forecasting. Reps forecast
# Incremental ARR only; renewal base rolls to GRR automatically.
#
# Implication: forecast_weekly's renewal-pipeline stage_weighted_forecast
# includes renewal base and should NOT be surfaced as forecast until
# compute_forecast.py is fixed to use incremental components only.
# ============================================================================

stage_map:
  appointmentscheduled:
    label: "Discovery"
    bucket: "discovery"
    transition: "discovery_to_scoping"
  qualifiedtobuy:
    label: "Scoping"
    bucket: "scoping"
    transition: "scoping_to_proposal"
  presentationscheduled:
    label: "Technical Evaluation"
    bucket: "proposal"
    transition: "proposal_to_negotiating"
  decisionmakerboughtin:
    label: "Review"
    bucket: "proposal"
    transition: null
  contractsent:
    label: "Contract Sent"
    bucket: "proposal"
    transition: null
    # Not a stage in any live pipeline: client.yaml lists 16 stage ids and the
    # HubSpot pipelines API resolves exactly those 16. It still appears in 2022
    # property history, so it must stay CLASSIFIED for reconstruction to read
    # that history. Distinct from retired_stages, which is for ids that cannot
    # be classified at all. Marked so the config-agreement test does not read
    # its absence from client.yaml as drift.
    historical: true
  closedwon:
    label: "Closed Won"
    bucket: "closed_won"
    transition: null
    aliases: ["1297321623"]        # raw numeric IDs that also mean this
  closedlost:
    label: "Closed Lost"
    bucket: "closed_lost"
    transition: null
    aliases: ["1297321624", "68509551"]   # includes Disqualified
    alias_labels: ["Disqualified"]  # alternate display names
  # Historical/deprecated stages (may appear in CSV exports or old data)
  "79653122":
    label: "Meeting Set"
    bucket: "discovery"
    transition: null
  "24682892":
    label: "Negotiating"
    bucket: "proposal"
    transition: null
  "43449439":
    label: "Awaiting Signature"
    bucket: "proposal"
    transition: null

  # Renewal pipeline (866608541). Excluded from new-business pipeline
  # analysis via pipelines.excluded, but must classify: an unmapped stage
  # is now a hard failure in reconstruction, not a silent "open".
  "1297321618":
    label: "Upcoming Renewal"
    bucket: "discovery"
    transition: null
  "1297321619":
    label: "Renewal Engaged"
    bucket: "scoping"
    transition: null
  "1297321620":
    label: "Pricing Presented"
    bucket: "proposal"
    transition: null
  # Live renewal stage. Deliberately its own entry rather than an alias of
  # contractsent: they share a bucket but not liveness, and an alias would
  # make this inherit historical: true and read as drift-exempt when it is
  # actually a current pipeline stage. Label is suffixed so it does not
  # collide with contractsent in the label -> stage_id reverse map.
  "1297321622":
    label: "Contract Sent (Renewal)"
    bucket: "proposal"
    transition: null

# Stage IDs that appear in HubSpot property history but no longer exist in
# any pipeline, active or archived — hard-deleted, so no label is recoverable
# from the API. Listed explicitly rather than left unmapped, so the discovery
# gate can distinguish "acknowledged and unreachable" from "new and unknown".
#
# Reconstruction still RAISES on these (point_in_time.is_terminal_stage does
# not consult this list). That is deliberate: they are provably unreachable,
# so encountering one means an assumption broke, and a loud failure beats a
# silent bucket. Verified unreachable by discover_historical_stages on every
# run: a lookup returns the last history entry at or before the date, and
# neither id is ever a deal's final entry, so neither can be returned.
retired_stages:
  "24682891":
    last_seen: "2023-04-14"
    first_seen: "2022-06-03"
    entries: 15
    deals: 14
    reason: >
      Hard-deleted custom stage from the pre-2023 default pipeline. Numerically
      adjacent to 24682892 (Negotiating), so created alongside it. Was the
      first history entry for 13 of 14 deals, and led to Negotiating, Review or
      Scoping. Bucket left unassigned: the transition evidence is ambiguous
      between an early and a mid stage, and a wrong bucket would stop erroring
      and start lying.
  "43746397":
    last_seen: "2022-11-21"
    first_seen: "2022-11-21"
    entries: 3
    deals: 3
    reason: >
      Hard-deleted custom stage. Always preceded by 24682891 or Closed Won and
      always followed by Review. Three entries on a single day across three
      deals, which reads like a one-off pipeline edit rather than a stage deals
      genuinely worked through.

# Which buckets count as won / lost / open — derived, but stated once.
outcome_buckets:
  won: ["closed_won"]
  lost: ["closed_lost"]
  open: ["discovery", "scoping", "proposal"]

# ============================================================================
# DEAL STATE DEFINITIONS
# ============================================================================
# Runtime business logic that defines deal states and risk conditions.
# These are semantic facts — true regardless of who asks, needed at runtime.

deal_states:
  at_risk:
    label: "At Risk"
    description: >
      A deal is "at risk" if ANY of these conditions are true:
      1. No activity (calls, emails, meetings) in 30+ days
      2. Overall MEDDICC score below 40 (out of 70)
      3. Champion gap (champion score below stage-required threshold)

    implementation: query_deals_at_risk
    # Handler currently uses stage-aware MEDDICC band checking.
    # TODO: Add 30-day activity check (needs last_activity_date field).
    # Definition verified with Ryan: 2026-09-01 (PENDING VERIFICATION)

    # NOTE: This is Ryan's term and means something specific to him.
    # The definition above is a starting point based on common sales
    # risk indicators. Needs confirmation before treating as authoritative.

# Field units and meanings the handlers depend on. Extend as needed.
field_units:
  arr_usd: "US dollars, annual recurring"
  deal_value: "US dollars, total contract value"
  duration_minutes: "minutes"
  champion_score: "0-10 MEDDICC component"
  economic_buyer_score: "0-10 MEDDICC component"
  metrics_score: "0-10 MEDDICC component"
  decision_criteria_score: "0-10 MEDDICC component"
  decision_process_score: "0-10 MEDDICC component"
  identify_pain_score: "0-10 MEDDICC component"
  compelling_event_score: "0-10 MEDDICC component"
  overall_score: "0-70 MEDDICC total"
