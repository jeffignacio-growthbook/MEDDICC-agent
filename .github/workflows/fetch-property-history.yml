name: Fetch HubSpot Property History

on:
  workflow_dispatch:
    inputs:
      force_refetch:
        description: 'Re-fetch every deal, ignoring any cache'
        required: false
        default: 'false'
      skip_fetch:
        description: 'Skip the ~9 min HubSpot fetch; run only Supabase-side checks'
        required: false
        default: 'false'
      phase4_write:
        description: 'Phase 4: WRITE the reconstruction to deals_snapshot (default is report-only). Collision pre-check aborts the job if the target quarters already hold rows.'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  fetch-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cheap guards first: if these fail, do not spend 6 minutes of HubSpot
      # API calls to find out.
      - name: "Pre-flight — offline test suite"
        run: |
          set -e
          PYTHONPATH=scripts:api:. python3 scripts/eval_reconstruction.py
          PYTHONPATH=scripts:api:. python3 scripts/eval_field_semantics.py
          PYTHONPATH=scripts:api:. python3 scripts/eval_migrations.py
          PYTHONPATH=scripts:api:. python3 scripts/eval_deal_value.py
          PYTHONPATH=scripts:api:. python3 scripts/analytics/diagnose_population_cap.py
          PYTHONPATH=scripts:api:. python3 scripts/analytics/compare_inclusion_rules.py

      - name: Config reader audit (ratchet)
        run: |
          python3 scripts/analytics/audit_config_readers.py

      - name: Fetch property history from HubSpot
        if: ${{ inputs.skip_fetch != 'true' }}
        env:
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "Tracked properties (point-in-time reconstruction needs all of them):"
          python3 -c "import sys; sys.path.insert(0,'scripts/analytics'); \
            from hubspot_history import TRACKED_PROPERTIES; \
            print('  ' + ', '.join(TRACKED_PROPERTIES))"
          echo ""
          FORCE=""
          if [ "${{ inputs.force_refetch }}" = "true" ]; then FORCE="--force"; fi
          python3 scripts/analytics/hubspot_history.py --all --rate-limit 5 $FORCE

      - name: "Cache summary"
        if: ${{ inputs.skip_fetch != 'true' }}
        run: |
          ls -lh property_history_cache.json
          python3 - <<'EOF'
          import json, collections
          c = json.load(open('property_history_cache.json'))
          deals = c['deals']
          print(f"deals: {len(deals)}")
          keys = ('history', 'amount_history', 'closedate_history',
                  'new_revenue_history', 'expansion_revenue_history',
                  'renewal_revenue_history', 'forecast_category_history')
          for k in keys:
              have = sum(1 for d in deals.values() if d.get(k))
              ent = sum(len(d.get(k) or []) for d in deals.values())
              print(f"  {k:<28} deals with entries: {have:>5}   total entries: {ent:>7}")
          lens = collections.Counter(len(d.get('history') or []) for d in deals.values())
          print(f"  dealstage history length: max {max(lens)}  "
                f"deals with 0 entries: {lens.get(0, 0)}")
          print(f"  errors: {len(c.get('errors', []))}")
          EOF

      # Diagnostic, and deliberately BEFORE the gate so it still runs when
      # the gate fails — which is exactly when its output is needed.
      - name: "Identify any unmapped stage IDs"
        if: ${{ inputs.skip_fetch != 'true' }}
        env:
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
        run: |
          set -o pipefail
          PYTHONPATH=scripts:api:. python3 \
            scripts/analytics/identify_unmapped_stages.py \
            2>&1 | tee unmapped_stage_report.txt

      # CONDITION 1 — every stage id in history must classify, or the
      # reconstruction gate would raise mid-backfill. Non-zero exit fails
      # the job on purpose.
      - name: "CONDITION 1 — historical stage ID coverage (gate)"
        if: ${{ inputs.skip_fetch != 'true' }}
        run: |
          set -o pipefail
          PYTHONPATH=scripts:api:. python3 \
            scripts/analytics/discover_historical_stages.py \
            2>&1 | tee stage_discovery_report.txt

      # CONDITION 2 — the earlier comparison stood current values in for
      # stage-as-of-D. With closedate history in the cache both arms are
      # reconstructed, so a disagreement is attributable to the rule rather
      # than to the proxy.
      - name: "CONDITION 2 — both arms point-in-time, FY2027 Q3 weeks 1-3"
        if: ${{ inputs.skip_fetch != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          PYTHONPATH=scripts:api:. python3 \
            scripts/analytics/compare_inclusion_rules_pit.py \
            2>&1 | tee pit_comparison_report.txt

      - name: "Snapshot coverage survey (Supabase only, no fetch needed)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          PYTHONPATH=scripts:api:. python3 \
            scripts/analytics/survey_snapshot_coverage.py \
            2>&1 | tee snapshot_coverage_survey.txt

      - name: "PHASE 2b — deal_value proxy vs point-in-time"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          PYTHONPATH=scripts:api:. python3 \
            scripts/analytics/report_value_reconstruction_delta.py \
            --include-excluded-pipelines \
            2>&1 | tee value_delta_report.txt

      - name: "PHASE 3 — dry-run reconstruct one quarter (writes nothing)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          PYTHONPATH=scripts:api:. python3 \
            scripts/analytics/dry_run_reconstruct_quarter.py \
            --quarter "FY2027 Q2" \
            --cross-validate-date 2026-08-19 \
            --out dry_run_reconstruction.json \
            2>&1 | tee dry_run_report.txt

      - name: "PHASE 4 — report-only reconstruction across elapsed quarters (writes nothing)"
        if: ${{ always() && inputs.phase4_write != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          PYTHONPATH=scripts:api:scripts/analytics:. python3 \
            scripts/analytics/backfill_snapshots.py --report-only \
            2>&1 | tee phase4_report_only.txt

      - name: "PHASE 4 — WRITE reconstruction to deals_snapshot (collision pre-check aborts on any existing rows)"
        if: ${{ success() && inputs.phase4_write == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          PYTHONPATH=scripts:api:scripts/analytics:. python3 \
            scripts/analytics/backfill_snapshots.py \
            2>&1 | tee phase4_write.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-history-and-reports
          path: |
            property_history_cache.json
            stage_discovery_report.txt
            unmapped_stage_report.txt
            pit_comparison_report.txt
            snapshot_coverage_survey.txt
            value_delta_report.txt
            dry_run_report.txt
            dry_run_reconstruction.json
            phase4_report_only.txt
            phase4_write.txt
            backfill_checkpoint.json
            backfill_reconstruction.json
          retention-days: 7
