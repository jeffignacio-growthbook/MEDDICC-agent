# Field semantics — the single source of truth for what fields MEAN.
# Client-specific. Template deployments override this file; no code changes.
#
# stage_map: HubSpot stage IDs → canonical meaning + pipeline bucket.
#   The bucket (discovery|scoping|proposal|closed) is what handlers
#   reason about. The stage_id is what lives in the deals.stage column.

# ============================================================================
# FORECAST SEMANTICS
# ============================================================================
# Forecast means Incremental ARR — new_arr + expansion_arr.
#
# Renewal base value (renewal_revenue) is NEVER included in forecast;
# it belongs to GRR and NRR metrics. A renewal deal contributes to forecast
# ONLY through its expansion component (expansion_arr).
#
# This prevents producing combined forecast numbers that include renewal base,
# which would overstate what reps are actually forecasting. Reps forecast
# Incremental ARR only; renewal base rolls to GRR automatically.
#
# Implication: forecast_weekly's renewal-pipeline stage_weighted_forecast
# includes renewal base and should NOT be surfaced as forecast until
# compute_forecast.py is fixed to use incremental components only.
# ============================================================================

# ============================================================================
# PIPELINE SEMANTICS (Dollar-Level Split — Confirmed Sep 6, 2026)
# ============================================================================
# "Pipeline" means Incremental ARR — expansion_arr + new_arr.
#
# DOLLAR-LEVEL SPLIT (not deal-level bucketing):
#   - For each deal, calculate: incremental_value = expansion_arr + new_arr
#   - Pipeline total = sum of incremental_value across all deals
#   - A renewal deal WITH expansion contributes BOTH:
#     * expansion_arr → incremental pipeline
#     * renewal_revenue → renewal ARR (reported separately)
#   - Same deal can appear in BOTH reports (measuring different components)
#
# TIMELESS DESIGN:
#   - Pipeline is CURRENT STATE (all active incremental ARR)
#   - NO relationship to close_date (no time filtering)
#   - User asking "this quarter" or "Q3" still gets ALL active incremental ARR
#   - Response must clarify: "Current Pipeline (Incremental ARR)"
#
# UNCATEGORIZED DEALS (NEITHER category):
#   - Deals with ALL ARR fields NULL/0 (no classification)
#   - Must be explicitly surfaced as data quality gap
#   - Never silently excluded from reporting
#
# CLASSIFICATION CATEGORIES:
#   - INCREMENTAL ONLY: expansion_arr > 0 OR new_arr > 0, renewal_revenue = 0
#   - RENEWAL ONLY: renewal_revenue > 0, expansion_arr = 0 AND new_arr = 0
#   - BOTH: renewal_revenue > 0 AND (expansion_arr > 0 OR new_arr > 0)
#   - NEITHER: all ARR fields NULL/0 (uncategorized data quality gap)
#
# Helper functions (field_semantics.py):
#   - is_incremental_pipeline(deal): True if deal has expansion_arr > 0 OR new_arr > 0
#   - is_renewal_base(deal): True if deal has renewal_revenue > 0
#
# Edge cases validated: scripts/audit_pipeline_classification.py
# ============================================================================

# ============================================================================
# PRECOMPUTED TABLES — PREFER THESE OVER RAW AGGREGATION
# ============================================================================
# These tables hold reconciled, point-in-time values. Use them instead of
# summing raw deals when they cover the metric being asked about.
#
# forecast_weekly:
#   - Columns: fiscal_quarter, week_of_quarter, computed_at,
#              stage_weighted_forecast, historical_conversion_low/mid/high
#   - Contains: Quarter forecast by stage probability and historical conversion
#   - Use for: "What do you forecast for Q3?" type questions
#
# waterfall_weekly:
#   - Columns: fiscal_quarter, week_of_quarter, computed_at, deal_id,
#              category (new_to_pipeline, pulled_in, pushed_out, etc.)
#   - Contains: Pipeline movement categorization for waterfall charts
#   - Use for: "What entered the pipeline?" "What slipped?" type questions
#
# pipeline_generation_weekly:
#   - Columns: fiscal_quarter, week_of_quarter, computed_at, new_deal_count,
#              new_deal_value, by_source, by_rep
#   - Contains: New pipeline generation metrics
#   - Use for: "How much pipeline did we generate?" type questions
#
# STALENESS GUARD (CRITICAL):
# A precomputed value is only valid if recent. If computed_at is stale relative
# to the question, STATE IT rather than silently serving an old number.
# Example: "Last computed 21 days ago on 2026-08-10 — may not reflect recent changes."
#
# If stale, either:
# - Return the precomputed value WITH the staleness caveat, OR
# - Fall back to raw aggregation (slower but current)
#
# Never silently serve a 3-week-old forecast as if it's today's number.
# ============================================================================

# ============================================================================
# DATA INTEGRITY RULES — UNIVERSAL (NOT CLIENT-SPECIFIC)
# ============================================================================
# These rules apply to EVERY client and are enforced automatically in
# field_semantics.py. They catch data quality issues that corrupt metrics.
#
# RULE 1: NEGATIVE CYCLE TIME EXCLUSION
#
# ANY deal where (close_date - create_date) < 0 is AUTOMATICALLY excluded
# from ALL metrics that use cycle time, win rate, or any create_date/close_date
# based calculation.
#
# Rationale:
#   - Negative cycle time is definitionally impossible
#   - Always indicates CRM migration backfill, bulk import artifacts, or data entry error
#   - Never represents a real sales cycle
#
# Detection pattern:
#   - Deal created AFTER it closed (future create_date relative to close_date)
#   - Example: create_date=2025-08-09, close_date=2023-10-21 → -658 days
#
# Applies to:
#   - cycle_time (median days from create to close)
#   - win_rate (won / (won + lost) where lost includes closed deals)
#   - velocity_to_close (days in each stage)
#   - conversion_rates (time-based funnel metrics)
#   - ANY metric computing date diffs
#
# Implementation:
#   - is_valid_cycle_deal(deal) in field_semantics.py checks this automatically
#   - Every handler using create_date/close_date MUST call this check
#   - Monitoring: negative_cycle_time_deals query flags new occurrences
#
# Template-portable:
#   - This rule is DEFAULT, non-configurable
#   - Applies to every client from day one
#   - CRM migrations/backfills are common enough that this is baseline hygiene
#
# Example violations found:
#   - deal_id=41609747117 (Netthandelsgruppen): create_date=2025-08-09, close_date=2023-10-21
#   - Excluded from Q016 cycle_time calculation (23 won → 22 cycle time sample)
#
# IMPORTANT: This is not a per-client config value or a manual exclusion list.
# It's a universal data integrity check that runs automatically on every query.
# ============================================================================

stage_map:
  appointmentscheduled:
    label: "Discovery"
    bucket: "discovery"
    transition: "discovery_to_scoping"
  qualifiedtobuy:
    label: "Scoping"
    bucket: "scoping"
    transition: "scoping_to_proposal"
  presentationscheduled:
    label: "Technical Evaluation"
    bucket: "proposal"
    transition: "proposal_to_negotiating"
  decisionmakerboughtin:
    label: "Review"
    bucket: "proposal"
    transition: null
  contractsent:
    label: "Contract Sent"
    bucket: "proposal"
    transition: null
    # Not a stage in any live pipeline: client.yaml lists 16 stage ids and the
    # HubSpot pipelines API resolves exactly those 16. It still appears in 2022
    # property history, so it must stay CLASSIFIED for reconstruction to read
    # that history. Distinct from retired_stages, which is for ids that cannot
    # be classified at all. Marked so the config-agreement test does not read
    # its absence from client.yaml as drift.
    historical: true
  closedwon:
    label: "Closed Won"
    bucket: "closed_won"
    transition: null
    aliases: ["1297321623"]        # raw numeric IDs that also mean this
  closedlost:
    label: "Closed Lost"
    bucket: "closed_lost"
    transition: null
    aliases: ["1297321624", "68509551"]   # includes Disqualified
    alias_labels: ["Disqualified"]  # alternate display names
  # Historical/deprecated stages (may appear in CSV exports or old data)
  "79653122":
    label: "Meeting Set"
    bucket: "discovery"
    transition: null
  "24682892":
    label: "Negotiating"
    bucket: "proposal"
    transition: null
  "43449439":
    label: "Awaiting Signature"
    bucket: "proposal"
    transition: null

  # Review (decisionmakerboughtin) is a parking lot for stalled or dead
  # deals that reps hope to revive. It is not a progression stage and is
  # excluded from forecast, conversion, and pipeline calculations via
  # exclude_from_analysis: true in client.yaml. Treat as terminal for
  # reconstruction purposes — a deal landing in Review is off the normal
  # progression path.
  "decisionmakerboughtin":
    label: "Review"
    bucket: "proposal"  # Nominal bucket, but excluded from analysis
    transition: null
    exclude_from_analysis: true

  # Renewal pipeline (866608541). Excluded from new-business pipeline
  # analysis via pipelines.excluded, but must classify: an unmapped stage
  # is now a hard failure in reconstruction, not a silent "open".
  "1297321618":
    label: "Upcoming Renewal"
    bucket: "discovery"
    transition: null
  "1297321619":
    label: "Renewal Engaged"
    bucket: "scoping"
    transition: null
  "1297321620":
    label: "Pricing Presented"
    bucket: "proposal"
    transition: null
  # Live renewal stage. Deliberately its own entry rather than an alias of
  # contractsent: they share a bucket but not liveness, and an alias would
  # make this inherit historical: true and read as drift-exempt when it is
  # actually a current pipeline stage. Label is suffixed so it does not
  # collide with contractsent in the label -> stage_id reverse map.
  "1297321622":
    label: "Contract Sent (Renewal)"
    bucket: "proposal"
    transition: null

# Stage IDs that appear in HubSpot property history but no longer exist in
# any pipeline, active or archived — hard-deleted, so no label is recoverable
# from the API. Listed explicitly rather than left unmapped, so the discovery
# gate can distinguish "acknowledged and unreachable" from "new and unknown".
#
# Reconstruction still RAISES on these (point_in_time.is_terminal_stage does
# not consult this list). That is deliberate: they are provably unreachable,
# so encountering one means an assumption broke, and a loud failure beats a
# silent bucket. Verified unreachable by discover_historical_stages on every
# run: a lookup returns the last history entry at or before the date, and
# neither id is ever a deal's final entry, so neither can be returned.
retired_stages:
  "24682891":
    last_seen: "2023-04-14"
    first_seen: "2022-06-03"
    entries: 15
    deals: 14
    reason: >
      Hard-deleted custom stage from the pre-2023 default pipeline. Numerically
      adjacent to 24682892 (Negotiating), so created alongside it. Was the
      first history entry for 13 of 14 deals, and led to Negotiating, Review or
      Scoping. Bucket left unassigned: the transition evidence is ambiguous
      between an early and a mid stage, and a wrong bucket would stop erroring
      and start lying.
  "43746397":
    last_seen: "2022-11-21"
    first_seen: "2022-11-21"
    entries: 3
    deals: 3
    reason: >
      Hard-deleted custom stage. Always preceded by 24682891 or Closed Won and
      always followed by Review. Three entries on a single day across three
      deals, which reads like a one-off pipeline edit rather than a stage deals
      genuinely worked through.

# Which buckets count as won / lost / open — derived, but stated once.
outcome_buckets:
  won: ["closed_won"]
  lost: ["closed_lost"]
  open: ["discovery", "scoping", "proposal"]

# ============================================================================
# DEAL STATE DEFINITIONS
# ============================================================================
# Runtime business logic that defines deal states and risk conditions.
# These are semantic facts — true regardless of who asks, needed at runtime.

deal_states:
  at_risk:
    label: "At Risk"
    description: |
      Deals with MEDDICC components below the threshold required to advance
      from their current stage. Uses stage-aware band checking from
      config/client.yaml stage_progression requirements.

    # CANONICAL DEFINITION: Stage-aware MEDDICC band checking
    # (Finalized after Wave 4 calibration investigation, Sep 2026)
    #
    # A deal is flagged at-risk when ANY MEDDICC component required at its
    # current stage falls below the threshold band needed to advance.
    #
    # Example: A deal in Discovery (appointmentscheduled) needs:
    #   - pain: 5 (yellow band)
    #   - champion: 4 (red band)
    # to advance to Scoping. If pain_score=3 (red) or champion_score=2 (red),
    # the deal is at-risk because it lacks advancement readiness.
    #
    # Stage requirements are loaded from config/client.yaml → stage_progression.
    # Band thresholds are defined in api/rubric.py MEDDICC_BANDS.
    #
    # TWO MODES:
    # 1. Full stage-aware check (canonical, used for drill-downs):
    #    - Load stage requirements from stage_progression
    #    - Check each required component against band threshold
    #    - Flag if ANY required component is below threshold band
    #
    # 2. Quick check (lightweight, used for pipeline summaries):
    #    - overall_score < 40 OR champion_score < 4
    #    - Faster but less precise (doesn't account for stage context)
    #    - Use only when full stage-aware check would be too expensive
    #
    # DECISION: Stage-aware is canonical. Quick check is a performance
    # optimization that may produce different counts (94 vs 70 vs 33 in
    # Wave 4 testing depending on scope and mode).

    canonical_mode: "stage_aware"  # stage_aware | quick_check
    stage_aware:
      source: "config/client.yaml → stage_progression"
      logic: "ANY required component below threshold band"
      band_source: "api/rubric.py → MEDDICC_BANDS"

    quick_check:
      # Lightweight fallback for expensive queries (e.g., inline in waterfall)
      # NOT canonical - may produce different counts than stage-aware
      rules:
        - field: "overall_score"
          operator: "lt"
          threshold: 40
        - field: "champion_score"
          operator: "lt"
          threshold: 4
      logic: "OR"  # Flag if ANY rule matches

    implementation: "is_at_risk"  # Generated function in field_semantics.py
    note: |
      Consolidated from two divergent implementations in Wave 4 remediation:
      - query_waterfall used quick_check (simple threshold) → 94 deals
      - query_deals_at_risk used stage_aware → 33 deals (scoped)
      Stage-aware is now canonical. Quick check remains for performance when needed.

# ============================================================================
# AT-RISK DEAL IDENTIFICATION (Q012) — SIGNAL-BASED DETECTION
# ============================================================================
# Alternative at-risk definition using time/activity signals, independent of
# MEDDICC scoring. Flags deals showing operational risk patterns (stalled,
# disengaged) regardless of qualification scores.
#
# VERIFICATION TYPE: PARTIALLY DERIVED, PARTIALLY HAND-PICKED
#
# Signal 2 is DERIVED (stage × segment specific, P75 from historical won deals)
# Signal 3 is HAND-PICKED (7-day global fallback, NOT empirically derived)
#
# This is NOT equally rigorous across signals. Signal 2 has empirical backing;
# Signal 3 is an operational default chosen because data didn't support derivation.

at_risk_definition:
  verification_type: "partially_derived_partially_hand_picked"

  signals:
    signal_1_stakeholder_count:
      status: "deferred"
      reason: "Required fields not available (contact-to-deal associations)"

    signal_2_time_in_stage:
      status: "implemented"
      derivation: "PARTIALLY_DERIVED"  # Most cells derived, 1 cell manual override
      methodology: |
        P75 of historical won deal time-in-stage per stage × segment cell.
        Uses dealstage property history from clean won population (218 deals after
        excluding 107 contaminated deals: 99 renewals + 15 negative cycle time).

        Minimum sample size n≥5 per cell for segment-specific thresholds.

        Exclusion filters (centralized in api/field_semantics.py):
        1. is_valid_cycle_deal(): excludes negative cycle time (create_date > close_date)
        2. is_renewal_deal(): excludes renewal pipeline (866608541) + renewal_revenue > 0

        Clean derivation documented in SIGNAL2_CLEAN_DERIVATION_SUMMARY.md.

      data_source: "property_history.dealstage"
      coverage: "100% (all closed deals have dealstage history)"

      threshold_type: "segment_specific_with_manual_override"
      segmentation: "stage × segment (Enterprise/Mid-Market/SMB)"

      fallback_hierarchy:
        - "stage_x_segment"  # Primary: use segment-specific if n≥5
        - "manual_override"  # Override: hand-set threshold for specific cell
        - "stage_only"       # Fallback: aggregate across segments if needed
        - "global"           # Last resort: single P75 across all stages

      manual_overrides:
        enterprise_discovery:
          cell: "discovery × Enterprise"
          threshold: 35  # days
          status: "MANUAL_OVERRIDE"
          replaces: "stage_only fallback (19 days)"

          rationale: |
            19-day stage-only fallback (derived from Mid-Market/SMB Discovery data, n=14)
            flagged 73.9% of Enterprise Discovery deals (34/46) - implausibly high,
            confirmed via sample review (see SIGNAL2_PRE_PRODUCTION_VALIDATION.md).

            Sample flagged deals included actively worked deals at 28-37 days, suggesting
            19 days does not reflect genuine Enterprise Discovery risk given the segment's
            naturally longer evaluation cycle (more stakeholders, longer eval).

            35 days set as temporary override pending sufficient Enterprise sample
            (currently n=2 clean won deals, need n≥5 for real segment-specific derivation).

            With 35-day override, flagging rate drops to 58.7% (27/46) - still high but
            more moderate. Deals still flagged (>35 days) include genuinely stale deals
            at 90-130 days with no recent activity.

          impact:
            before_override_flagging_rate: "73.9% (34/46 Enterprise Discovery deals)"
            after_override_flagging_rate: "58.7% (27/46 Enterprise Discovery deals)"
            deals_no_longer_flagged: 7
            newly_healthy_deals: "20-35 day range (Zurich 28d, Robinhood 20d, etc.)"

          re_derivation_trigger: |
            Revisit once Enterprise Discovery clean won deal count reaches n≥5.

            Current: n=2 (insufficient for segment-specific derivation)
            Target: n≥5 (minimum sample size threshold)

            Re-run scripts/derive_signal2_clean.py quarterly and check this cell's
            sample size. When n≥5 reached, remove manual override and use derived
            segment-specific threshold.

          temporary_until: "Enterprise Discovery clean won deals n≥5"
          set_by: "Jeff (domain knowledge validation, 2026-09-07)"
          documented_in: "SIGNAL2_PRE_PRODUCTION_VALIDATION.md"

      derived_thresholds:
        discovery:
          mid_market:
            threshold: 19  # days
            sample_size: 7
            status: "segment_specific"
          smb:
            threshold: 25  # days
            sample_size: 5
            status: "segment_specific"
            note: "Exactly at minimum n=5 threshold - re-derive quarterly"
          enterprise:
            threshold: 35  # days (MANUAL_OVERRIDE, not derived)
            sample_size: 2
            status: "MANUAL_OVERRIDE"
            note: "Override replaces 19-day stage_only fallback, pending n≥5"

        scoping:
          mid_market:
            threshold: 23  # days
            sample_size: 5
            status: "segment_specific"
            note: "Exactly at minimum n=5 threshold - re-derive quarterly"
          enterprise:
            threshold: 23  # days (stage_only fallback)
            sample_size: 2
            status: "stage_only"
          smb:
            threshold: 23  # days (stage_only fallback)
            sample_size: 2
            status: "stage_only"

        proposal:
          all_segments:
            threshold: 105  # days (stage_only, all cells n<5)
            sample_size: 8
            status: "stage_only"
            note: "0 renewals in sample - clean threshold"

      interpretation: |
        Enterprise deals naturally sit longer than SMB deals. Segment-specific
        thresholds reflect pace differences.

        Discovery thresholds (19-35 days) align with 2-4 week evaluation cycles.
        Enterprise Discovery uses 35-day override (vs 19-day derived fallback) to
        account for longer stakeholder engagement typical of Enterprise segment.

        Proposal threshold (105 days, ~3.5 months) reflects complex technical
        evaluation + procurement cycles common in B2B deals.

      contamination_impact: |
        Before applying exclusion filters, Discovery thresholds were severely inflated
        by renewal contamination:
        - Enterprise Discovery: 463 days → 19 days (after exclusions)
        - Mid-Market Discovery: 184 days → 19 days
        - SMB Discovery: 454 days → 25 days

        Renewal deals (30.5% of won population) inflated metrics by 20-24x.
        Same contamination pattern identified in Q016 cycle time investigation.

        Proposal stage uncontaminated (0 renewals out of 8 deals).

      re_derivation_schedule: "quarterly"
      re_derivation_triggers:
        - "Sample sizes improve (especially thin cells at n=5)"
        - "Enterprise Discovery reaches n≥5 (currently n=2)"
        - "Exclusion rate changes significantly (currently 32.9%)"

    signal_3_activity_recency:
      status: "implemented"
      derivation: "HAND_PICKED"
      methodology: |
        SIMPLE GLOBAL FALLBACK: Flag deals with no notes_last_updated activity
        in the last 14 days.

        NOT DERIVED from won/lost separation. Earlier investigation found this
        data source doesn't support empirical threshold derivation:
        - Insufficient coverage (46% after exclusions)
        - Sample sizes too thin (3/9 cells viable)
        - No consistent won/lost separation (backwards direction in 2/3 cells)

        14 days confirmed against Jeff's operational intuition for GrowthBook's
        actual sales cadence (10-14 day range felt right; 14 selected as the
        specific value). This is domain knowledge validation, not empirical
        derivation from won/lost separation.

        Full investigation documented in SIGNAL3_DEFERRAL_FINAL.md.

      threshold: 14  # days
      threshold_type: "global"
      segmentation: "none"

      data_source: "property_history.notes_last_updated"
      coverage: "54% (137/253 clean closed deals have activity data)"

      limitations:
        not_segment_specific: |
          Single global 14-day cutoff. Will likely OVER-FLAG fast-moving SMB
          deals (where 14 days may be normal pace) and UNDER-FLAG slower
          Enterprise deals (where 14 days is trivial, 30+ days might be concern).

          Same imbalance identified as a risk when Signal 2 was using global
          proxy before segment-specific derivation. Signal 3 still has this
          issue because data didn't support segment-specific thresholds.

        not_stage_specific: |
          14 days applies equally to Discovery, Scoping, and Proposal stages.
          Different stages may have different natural engagement rhythms, but
          insufficient data to derive stage-specific thresholds.

        coverage_gap: |
          33-36% of deals have ZERO activity history (not just "no activity
          in 14 days" — literally never logged any notes_last_updated changes).

          For these deals, Signal 3 cannot fire either way. They route to
          no_signal_at_risk / no_signal_healthy split, evaluated on Signal 2
          alone with manual-review flag per modified-AND design.

          A 14-day threshold doesn't change the fact that some deals have no
          data to check against it at all.

      future_refinement_flag: true
      future_refinement_note: |
        Once more data accumulates or logging discipline improves, REVISIT
        deriving a real threshold per the original methodology (won vs lost
        recency separation, segment-specific) rather than leaving 14 days as
        a permanent placeholder.

        Current 14-day fallback is acceptable for operational alerting but
        should not be treated as final. Re-evaluate when:
        - Coverage improves to ≥50%
        - Sample sizes increase (≥50% of cells with n≥5 per outcome)
        - Discovery × SMB inversion pattern clarified (currently n=9/19)

  logic: "modified_AND"

  modified_AND_specification: |
    CRITICAL classification when BOTH signals fire:
    - Signal 2 fires: time_in_stage > segment-specific threshold
    - Signal 3 fires: days_since_last_activity > 14

    WARN classification when Signal 2 alone fires:
    - Signal 2 fires BUT Signal 3 doesn't (recent activity, long stage time)
    - Suggests deal is active but not progressing

    NO_SIGNAL classification when Signal 3 cannot evaluate:
    - Deal has NO activity history at all (not in property_history)
    - Signal 2 still evaluates (stage timing independent of activity logging)
    - Flag as "no_signal_at_risk" if Signal 2 fires
    - Flag as "no_signal_healthy" if Signal 2 doesn't fire
    - Both marked for manual review (coverage gap, not normal operation)

    HEALTHY classification when neither signal fires:
    - Deal progressing normally with recent engagement

  classification_matrix:
    signal_2_fires_signal_3_fires: "critical"
    signal_2_fires_signal_3_no_fire: "warn"
    signal_2_fires_signal_3_no_data: "no_signal_at_risk"
    signal_2_no_fire_signal_3_fires: "healthy"  # Recent activity, normal pacing
    signal_2_no_fire_signal_3_no_fire: "healthy"
    signal_2_no_fire_signal_3_no_data: "no_signal_healthy"  # Manual review flag

  implementation:
    handler: "identify_at_risk_deals_q012"
    signal_2_function: "get_time_in_stage_threshold(stage_bucket, segment)"
    signal_3_function: "get_days_since_last_activity(deal_id)"
    classification_function: "classify_deal_risk(signal_2_result, signal_3_result)"

  monitoring:
    daily_check: true
    alert_on_new_critical: true
    alert_on_prolonged_critical_days: 7
    alert_on_count_increase_pct: 20

  documentation:
    full_spec: "Q012_IMPLEMENTATION_FINAL.md"
    signal_3_deferral: "SIGNAL3_DEFERRAL_FINAL.md"
    derivation_session: "SESSION_SUMMARY_2026-09-07.md"

# ============================================================================
# FIELD DISPLAY NAMES — USE IN SYNTHESIS, NOT COLUMN NAMES
# ============================================================================
# User-facing answers must use these display names, never raw column names.
# A synthesis that says "deal_value" means nothing to a CRO who thinks in ARR.
#
# Field → Display Name mapping:
field_display_names:
  deal_value: "Incremental ARR"
  arr_usd: "Total ARR"
  new_arr: "New ARR"
  expansion_arr: "Expansion ARR"
  renewal_revenue: "Renewal ARR"
  close_date: "Expected Close Date"
  created_at: "Created Date"
  stage_probability: "Win Probability"

# Field units and meanings the handlers depend on. Extend as needed.
field_units:
  arr_usd: "US dollars, annual recurring"
  deal_value: "US dollars, incremental ARR (new + expansion)"
  duration_minutes: "minutes"
  champion_score: "0-10 MEDDICC component"
  economic_buyer_score: "0-10 MEDDICC component"
  metrics_score: "0-10 MEDDICC component"
  decision_criteria_score: "0-10 MEDDICC component"
  decision_process_score: "0-10 MEDDICC component"
  identify_pain_score: "0-10 MEDDICC component"
  compelling_event_score: "0-10 MEDDICC component"
  overall_score: "0-70 MEDDICC total"

# ============================================================================
# MISSING VALUE SEMANTICS — WHAT "NO ARR RECORDED" MEANS
# ============================================================================
# "Which deals have no ARR recorded?" is ambiguous across five columns:
# deal_value, arr_usd, new_arr, expansion_arr, renewal_revenue.
#
# deal_value is often populated with 0 or a computed fallback even when the
# component fields are null, so filtering on deal_value=null returns zero rows
# and produces a confident wrong answer ("every deal has ARR recorded").
#
# A deal has no ARR recorded when BOTH conditions hold:
# 1. The pipeline-appropriate value field is null or zero:
#    - New business: deal_value (incremental ARR)
#    - Renewals: renewal_revenue (renewal base)
# 2. The component fields are also empty or zero:
#    - new_arr, expansion_arr, renewal_revenue all null/zero
#
# When asked "which deals have no ARR", check ALL value columns, not just one.
# A zero-row result on this question is suspicious and should be questioned
# rather than treated as conclusive — deal_value may be defaulted to 0.
#
# Correct filter approaches:
# - Check component fields: new_arr=is.null AND expansion_arr=is.null AND renewal_revenue=is.null
# - Check zero values: deal_value=eq.0 OR deal_value=is.null
# - Aggregate first, then filter on computed "has_any_arr" flag
#
# Never filter on deal_value=is.null alone for "no ARR" questions.
# ============================================================================

# ============================================================================
# FIELD FORMATS — EXACT FORMAT FOR FILTER CONSTRUCTION
# ============================================================================
# When constructing filters, use these exact formats. A mismatch returns 0 rows.
#
# fiscal_quarter format: "FYYYYQN" with space between year and quarter
#   Correct:   fiscal_quarter = "FY2027 Q3"
#   Incorrect: fiscal_quarter = "FY2027Q3" (no space, returns 0 rows)
#
#   Examples in forecast_weekly, waterfall_weekly, pipeline_generation_weekly:
#   - "FY2027 Q3" (Aug 1 - Oct 31, 2026)
#   - "FY2027 Q4" (Nov 1 - Jan 31, 2027)
#   - "FY2028 Q1" (Feb 1 - Apr 30, 2027)
#
# date format: ISO 8601 "YYYY-MM-DD"
#   Correct: close_date >= "2026-08-01"
#
# deal_status values: "active", "won", "lost" (lowercase)
# ============================================================================

# ============================================================================
# SCOPE VOCABULARY — DISAMBIGUATE PIPELINE POPULATIONS
# ============================================================================
# The forecast answer conflated two different populations. An answer must
# state which scope it means.
#
# Three distinct scopes:
#
# 1. OPEN PIPELINE
#    - All active deals (deal_status = 'active')
#    - Regardless of close date
#    - Includes deals closing this quarter, next quarter, and beyond
#    - Use case: "How much pipeline do we have overall?"
#
# 2. QUARTER PIPELINE
#    - Deals with close_date inside a specific quarter
#    - Example: FY2027 Q3 = Aug 1 - Oct 31, 2026
#    - Subset of open pipeline scoped by close date
#    - Use case: "What's in the Q3 pipeline?" "What do you forecast for Q3?"
#
# 3. QUALIFIED PIPELINE
#    - At or above qualified_stage_order threshold
#    - Excludes parking-lot stages (exclude_from_analysis: true)
#    - Excludes renewal pipeline (if specified in config)
#    - Can be combined with Quarter (qualified Q3 pipeline)
#    - Use case: "How much qualified pipeline do we have?"
#
# Examples that are DIFFERENT QUESTIONS:
# - "$16.1M open" = all active deals (answer #1)
# - "$7.6M Q3" = deals closing in Q3 (answer #2)
# - "$4.2M qualified Q3" = qualified deals closing in Q3 (answer #2 + #3)
#
# Handler logic MUST state which scope it used. Never say "$7.6M in Discovery"
# without clarifying whether that's "Discovery deals overall" or "Discovery
# deals closing in Q3".
# ============================================================================

# ============================================================================
# KNOWN HYGIENE RULES REGISTRY
# ============================================================================
# Registry of data hygiene rules used for metric validation and backtest refinement.
# These rules filter contaminated data that corrupts metric calculations.
#
# Each rule specifies:
#   - name: Short identifier for the hygiene rule
#   - function: Function name in api/field_semantics.py that implements the rule
#   - applies_to: Which metric types this rule applies to (for candidate iteration)
#   - description: What the rule does and why it's necessary
#   - rationale: Evidence or reasoning for why this hygiene check is needed
#
# Usage:
#   - Backtest engine: Iterates through rules to refine candidate queries
#   - Metric validation: Documents which hygiene rules were applied
#   - Template deployment: Client-specific rules can be added here
#
# Template-portable:
#   - is_valid_cycle_deal: Universal (applies to all clients)
#   - is_renewal_base: Client-specific (renewal pipeline ID varies)
# ============================================================================

known_hygiene_rules:
  - name: exclude_renewals
    function: is_renewal_base
    applies_to:
      - cycle_time
      - win_rate
      - pipeline_generation
      - new_business_metrics
    description: >
      Excludes renewal-pipeline deals from new-business metrics.
      Renewal deals have fundamentally different sales cycles (existing customer
      renewals vs. net-new acquisition) and contaminate new-business cycle time,
      win rate, and velocity calculations.
    rationale: >
      Cycle time investigation (Q016) found renewal contamination inflated median
      from 52 days (clean) to 116 days (contaminated). Renewals represented 30.5%
      of won population and inflated metrics by ~2.2x.
    implementation_note: >
      is_renewal_base() checks: pipeline_id == renewal_pipeline_id AND renewal_revenue > 0.
      Renewal pipeline ID is client-specific (866608541 for GrowthBook).

  - name: exclude_invalid_cycle_time
    function: is_valid_cycle_deal
    applies_to:
      - cycle_time
      - win_rate
      - velocity_to_close
      - conversion_rates
      - any_date_diff_calculation
    description: >
      Excludes deals with negative or impossible cycle time (create_date > close_date).
      Negative cycle time is definitionally impossible and always indicates CRM
      migration backfill, bulk import artifacts, or data entry error.
    rationale: >
      Universal data integrity rule. Cycle time investigation found deals with
      create_date AFTER close_date (e.g., created 2025-08-09, closed 2023-10-21
      → -658 days). Such deals never represent real sales cycles.
    implementation_note: >
      is_valid_cycle_deal() checks: both dates exist AND (close_date - create_date) >= 0.
      This is UNIVERSAL (not client-specific) and applies to every deployment.

  - name: exclude_stale_pipeline
    function: is_fresh_pipeline_deal
    applies_to:
      - pipeline_value
      - pipeline_generation
      - active_pipeline_metrics
      - velocity_metrics
    description: >
      Excludes deals that have been open for >180 days with no meaningful movement.
      Stale deals contaminate pipeline health metrics and velocity calculations
      by including abandoned/dormant opportunities that are unlikely to close.
    rationale: >
      Phase 2b validation (2026-09-07) found 4 stale deals (>180 days old) totaling
      $155,000 (2.2% of active pipeline). These deals (Chaos, Hey Harper, Catena Media,
      YourParkingSpace) have been open 187-238 days with no recent activity, indicating
      stalled/abandoned opportunities.
    evidence: >
      Real hygiene gap discovered during Test 2 escalation validation. Stale pipeline
      contamination is a common sales ops issue - deals that should be closed-lost but
      remain in "open" stages indefinitely. This contamination affects:
      - Pipeline value (inflated by dormant deals)
      - Win rate (denominator includes unlikely-to-close deals)
      - Velocity (stale deals drag down average time-in-stage)
    implementation_note: >
      is_fresh_pipeline_deal() checks: deal is active AND
      (current_date - create_date) <= 180 days. The 180-day threshold is
      CLIENT-SPECIFIC (based on GrowthBook's typical sales cycle). Other clients
      may need different thresholds (e.g., enterprise: 270 days, SMB: 90 days).
    status: "discovered_in_phase2b_validation"
    discovered_date: "2026-09-07"
    recommendation: >
      Monitor stale pipeline as data quality issue. Consider workflow automation
      to flag deals approaching 180 days for review/closure. This should also be
      checked by snapshot_coverage or data_completeness monitoring triggers.

# ============================================================================
# SALES TARGETS AND ATTAINMENT
# ============================================================================
# Source of truth: config/targets.yaml (edited by humans)
# Query target: rep_targets table (seeded from config via scripts/seed_targets.py)
#
# The table is derived from config. After editing targets.yaml, run:
#   python scripts/seed_targets.py
#
# Semantic context loads from config; handlers query the table.
# This gives agents context and handlers efficient joins.
#
# Target basis: Incremental ARR (new_arr + expansion_arr)
#   - Reps are measured on Incremental ARR, never renewal base
#   - Renewal revenue (renewal_revenue) belongs to GRR/NRR metrics
#   - Attainment = (new_arr + expansion_arr) / target
#
# Team structure:
#   - Team total is the sum of AE quotas
#   - Account Managers (AMs) contribute revenue without a personal quota
#   - AMs appear in revenue contribution but never in attainment %
#   - A rep with no target is not a data gap if they are in non_quota_roles
#
# Gap to plan frame:
#   - Default frame for forecast, pipeline, and attainment questions
#   - Not: "Q3 forecast is $1.9M"
#   - But: "Q3 forecast is $1.9M against a $1.55M target — $350K headroom"
#
# Required pipeline calculation:
#   - Use measured conversion rate, not fixed coverage multiples
#   - Required pipeline = target ÷ measured_conversion_rate
#   - Example: $1.55M target ÷ 9.9% conversion = ~$15.7M required
#   - Coverage multiples (2.5x, 2.0x in config) are miscalibrated vs ~9.9% actual
#
# Constraints:
#   - Targets are facts the client provides, not values the agent derives
#   - If a quarter has no target configured, say so rather than inferring
# ============================================================================
