name: "One-off: verify migration 022"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: Agent
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify migration 022
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cat <<'PYEOF' > /tmp/verify022.py
          import os, sys
          sys.path.insert(0, 'scripts')
          from supabase import create_client
          from supabase_client import select_all
          sb = create_client(os.environ['SUPABASE_URL'],
                             os.environ['SUPABASE_SERVICE_KEY'])

          print("=== CHECK 1: do the 3 tables exist? ===")
          for t in ['deal_risks', 'competitive_signals',
                    'pipeline_signals']:
              try:
                  rows = select_all(sb, t, columns='id')
                  print(f"  {t:22s} EXISTS (rows: {len(rows)})")
              except Exception as e:
                  print(f"  {t:22s} MISSING -> {str(e)[:80]}")

          print("\n=== CHECK 2: other_category_monitor ===")
          try:
              rows = select_all(sb, 'other_category_monitor',
                  columns='source_table,category,count,pct_of_total')
              print(f"  total rows in view: {len(rows)}")
              per = {}
              for r in rows:
                  per.setdefault(r['source_table'], []).append(r)
              for tbl, rs in sorted(per.items()):
                  tot = sum(int(r['count']) for r in rs)
                  print(f"\n  {tbl}: {len(rs)} categories, "
                        f"{tot} rows total")
                  for r in sorted(rs, key=lambda x: -int(x['count'])):
                      print(f"     {r['category']:24s} "
                            f"{r['count']:>4}  {r['pct_of_total']}%")
          except Exception as e:
              print(f"  VIEW ERROR -> {str(e)[:200]}")

          print("\n=== CHECK 3: data_dictionary entries ===")
          try:
              dd = select_all(sb, 'data_dictionary',
                  columns='supabase_table,supabase_column,source',
                  filters=[('eq', 'supabase_column', 'category')])
              for r in dd:
                  print(f"  {r['supabase_table']}.{r['supabase_column']} "
                        f"(source={r['source']})")
              if not dd:
                  print("  none found")
          except Exception as e:
              print(f"  ERROR -> {str(e)[:200]}")
          PYEOF
          python3 /tmp/verify022.py
