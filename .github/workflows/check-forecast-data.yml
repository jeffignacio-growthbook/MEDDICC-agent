name: Check Forecast Data

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase

      - name: Check forecast category data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, 'scripts')
          from supabase import create_client
          from supabase_client import select_all
          from collections import Counter

          sb = create_client(os.getenv('SUPABASE_URL'), os.getenv('SUPABASE_SERVICE_KEY'))

          print('='*70)
          print('FORECAST_CATEGORY DISTRIBUTION')
          print('='*70)

          deals = select_all(sb, 'deals', columns='forecast_category, deal_value, deal_status, stage')
          active_deals = [d for d in deals if d.get('deal_status') == 'active']

          # Group by forecast_category
          cat_stats = {}
          for d in active_deals:
              cat = d.get('forecast_category') or 'NULL'
              if cat not in cat_stats:
                  cat_stats[cat] = {'count': 0, 'value': 0.0}
              cat_stats[cat]['count'] += 1
              cat_stats[cat]['value'] += float(d.get('deal_value') or 0)

          # Sort by count descending
          for cat in sorted(cat_stats.keys(), key=lambda k: cat_stats[k]['count'], reverse=True):
              stats = cat_stats[cat]
              print(f'{cat:20s} {stats[\"count\"]:>5d} deals  \${stats[\"value\"]:>15,.0f}')

          print()
          print('='*70)
          print('STAGE COVERAGE CHECK')
          print('='*70)
          has_stage = sum(1 for d in deals if d.get('stage'))
          null_stage = sum(1 for d in deals if not d.get('stage'))
          print(f'has_stage       {has_stage:>6d} deals')
          print(f'null_stage      {null_stage:>6d} deals')
          "
