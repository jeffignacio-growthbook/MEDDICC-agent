name: Pre-Merge Gate Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
        default: 'main'
      run_smoke:
        description: 'Run TEST 3, the live 8-question smoke test against Railway (posts to Slack). Off by default; turn on only when validating a deploy.'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  gate-tests:
    runs-on: ubuntu-latest
    environment: Agent
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "TEST 1e — Offline: Supabase client construction degrades gracefully, never crashes the app on import"
        run: |
          set -e
          # 2026-09-11: THIS EXACT JOB failed twice in a row (ruled out as
          # a flake) with `ImportError: cannot import name 'ClientOptions'
          # from 'supabase' (unknown location)` at api/db.py's top-level
          # import — added for the retry-transport fix earlier the same
          # night — killing every single downstream test in this
          # workflow before any of them got a chance to run. Could NOT be
          # reproduced in a fresh local venv install of the identical
          # pinned requirements; the specific trigger on GitHub's hosted
          # runner is still unknown (see PENDING_WORK.md's follow-up
          # investigation) — but Railway's own deploy process plausibly
          # does something similar to this fresh CI install, so an
          # unguarded top-level ClientOptions import risked crashing the
          # live app on its next deploy, not just this workflow.
          # Fixed by moving the ClientOptions import inside
          # create_resilient_supabase_client()'s own try block (scripts/
          # supabase_client.py) — lazy, not top-level — so ANY import-time
          # failure building the resilient client (ClientOptions missing,
          # or any other exception) degrades to a plain create_client()
          # with no retry protection and a clear [SUPABASE_RETRY] warning,
          # rather than ever propagating up and crashing the caller.
          # api/db.py itself no longer imports ClientOptions at all.
          # Placed as the FIRST test in this workflow, before TEST 0,
          # specifically because it is the fix for the failure that took
          # down TEST 0 itself — if this regresses, it should be the
          # first thing to go red, not discovered via a cascade of
          # skipped downstream steps. test_supabase_client_fallback.py
          # proves the trap actually springs: forces the exact
          # ImportError shape from the live CI log (not just the happy
          # path, already covered when the retry transport shipped) and
          # confirms a working client still comes back, a clear warning
          # gets logged, ANY exception (not just ImportError) triggers
          # the same fallback, and api/db.py's own source no longer
          # imports ClientOptions at module level at all — the literal
          # line that crashed.
          PYTHONPATH=. python3 tests/test_supabase_client_fallback.py

      - name: "TEST 0 — Offline: greeting/help handler + handler descriptions"
        run: |
          set -e
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_help_handler.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_handler_descriptions.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_slip_diagnosis.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_query_deal_stages_bulk.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_rubric_scores_bulk.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_handlers_no_raise.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_fallback_message.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_intent_param_contract.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_meddicc_score_presentation.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_scoring_pipeline.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_stage_score_hygiene.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_evidence_contract.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_score_correction.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_scoring_bands.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_transcript_store.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_evaluator_json_salvage.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_score_pinning.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_force_reanalyze.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_per_call_rollup.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_rollup_render.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_snapshot_precutover.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_score_new_calls.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_bestseller_incident.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_multicompany_entity_scope.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_component_evidence.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_synthesis_style.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_synthesis_evidence_first.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_requirements_complete.py

      - name: "TEST 0b — Offline: forecast analytics correctness (the 5 defects)"
        run: |
          set -e
          # Behavioral (fixture-computed) coverage of the forecast analytics
          # defects — in-quarter numerator, unfiltered denominator, shared scope,
          # null-value propagation (util + in situ), point-in-time stage — plus
          # the null-coalescing ratchet. These previously ran ONLY in the
          # dispatch-only forecast-correctness workflow, so a regression that
          # produced 196-vs-31 or 110% conversion wasn't caught on a normal PR.
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/test_forecast_analyses.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_forecast_correctness.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_reconstruction.py
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/eval_waterfall_null_insitu.py

      - name: "TEST 0be — Offline: forecast-trustworthiness primitive (assess_forecast_trust)"
        run: |
          set -e
          # 2026-09-19: NORTH_STAR.md CRO Priority #1 — "how much should I
          # trust this quarter's number." scripts/forecast_trust.py composes
          # assess_deal_risk() (called directly on THIS quarter's own
          # COMMIT+MOST_LIKELY query, never via get_at_risk_deals()'s
          # COMMIT-only scope) with a new, week-indexed historical baseline
          # (query_commit_ml_calibration_by_week(), forecast_analyses.py) —
          # a MOVING comparison against whatever week the current quarter
          # is actually in, never a fixed anchor. Gated below week 3 (reps
          # structurally don't tag Commit/Most-Likely honestly in the
          # coverage-building phase yet).
          #
          # scripts/test_forecast_trust.py covers the composing function
          # itself: the week-3 hard gate (asserts no downstream query
          # fires), stability-band/caveat assignment across weeks 7 and 12,
          # a planted-discrepancy proof that the historical lookup
          # genuinely varies across 4 distinct weeks (not a hardcoded or
          # cached value — verified by actually planting that exact bug and
          # confirming the test caught it before this shipped), and the
          # single most important test in the batch: a MOST_LIKELY-tagged,
          # non-late-stage deal must still appear in the assessed cohort —
          # the direct regression guard for the get_at_risk_deals()
          # COMMIT-only gap this primitive was built to avoid (also
          # verified by planting that exact regression and confirming the
          # query-shape assertion, not the data-presence one, is what
          # actually catches it — a Mock returns its canned data
          # regardless of the real filter, so only checking the deal
          # showed up would have been a false sense of security).
          #
          # test_commit_ml_calibration_by_week_structure (added to
          # test_forecast_analyses.py) covers the new calibration function
          # independently: full 13-week coverage, defaults to
          # COMMIT_ML_CATEGORIES, and queries via .in_() rather than a
          # single-category .eq() — already run above by TEST 0b, not
          # duplicated here.
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/test_forecast_trust.py

      - name: "TEST 0bf — Offline: pipeline-coverage primitive (assess_pipeline_coverage)"
        run: |
          set -e
          # 2026-09-19: NORTH_STAR.md CRO Priority #2 — "how much pipeline
          # coverage do we have against goal." scripts/pipeline_coverage.py
          # composes: New+Expansion-only, qualified-pipeline-only, Q-scoped
          # current pipeline; a stage-level close-rate weighting built
          # fresh (forecast_analyses.query_stage_close_rate — no per-stage
          # close-rate primitive existed to reuse); a REAL current-quarter
          # quota+stretch target (rep_targets team total + a manually-set
          # $2.1M stretch figure documented in config/targets.yaml, a real
          # GrowthBook business decision, not computed); and a HEURISTIC
          # historical coverage curve (forecast_analyses.query_coverage_
          # proxy_target_by_week — confirmed live that no complete
          # historical quarter ever had a real target, so this is a 2x-
          # prior-year-actual proxy resting on a permanent, confirmed
          # evidence ceiling: none of the 4 prior-year bases clear
          # min_evidence_count=30). Every output surface always phrases
          # gap-to-goal ("$X short of target"/"$X over target"), never a
          # bare ratio, and the historical curve must always carry the
          # literal word HEURISTIC — never conflated with the real
          # current-quarter target.
          #
          # scripts/test_pipeline_coverage.py covers the composing
          # function itself: scope filtering (New+Expansion only, renewal
          # pipeline excluded, qualified-stage boundary reused exactly),
          # stage weighting (a gated stage's deal is weighted by its real
          # win_rate; an ungated stage's deal is excluded from the
          # weighted total, never defaulted to a 1.0 weight), gap-to-goal
          # phrasing in both directions, and the mandatory HEURISTIC
          # label on the historical curve vs. the real target's note
          # never carrying one. Both the heuristic-label requirement and
          # the renewal-pipeline exclusion were verified by actually
          # planting the exact regression in scripts/pipeline_coverage.py
          # (stripping the HEURISTIC word from the output note; bypassing
          # is_incremental_pipeline()) and confirming the relevant tests
          # genuinely failed before restoring the real code and confirming
          # a clean pass — not just written and trusted.
          #
          # test_stage_close_rate_structure / test_coverage_proxy_target_
          # by_week_structure (added to test_forecast_analyses.py, already
          # run above by TEST 0b) cover the two new forecast_analyses.py
          # functions independently — deal-week pooling by stage_order
          # with renewal exclusion, and the 2x-prior-year proxy-target
          # computation with mandatory heuristic labeling — not duplicated
          # here.
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/test_pipeline_coverage.py

      - name: "TEST 0bg — Offline: rep-coaching Criterion C talk-ratio diagnostic (assess_call_talk_ratio)"
        run: |
          set -e
          # 2026-09-19: rep-coaching primitive, Criterion C (talk-time /
          # question-share). DIAGNOSTIC ONLY, no pass/fail threshold — the
          # first calibration attempt (owner-name matched against a call's
          # own participant_emails) never cleared the 90% reliability bar
          # (76.7%/81.5% on the full population). scripts/coaching_talk_
          # ratio.py replaces that entirely for Apollo-sourced calls with
          # an EXACT PARTICIPANT-ID MATCH (no name-matching anywhere),
          # confirmed live via a three-run investigation that Apollo's
          # conversation-detail `participants` field ties a diarized
          # speaker to a real email/account by the same id already used
          # as call_transcripts' speaker key (migration 065,
          # participant_identities). That mechanism's own reliability has
          # not yet been calibrated into a won/lost threshold, so this
          # returns plain numbers only — never a judgment.
          #
          # Fireflies has NO equivalent anywhere in its API (confirmed
          # live — querying `email` on its Sentence type is rejected by
          # the schema) and MUST return insufficient_data/
          # source_not_supported here, explicitly, every time.
          #
          # scripts/test_coaching_talk_ratio.py covers: the source gate
          # (non-Apollo always insufficient_data), missing-identities /
          # missing-speech-data gating, the normal Apollo case (hand-
          # verified ratio arithmetic), bot/unmatched-speaker exclusion
          # from BOTH sides of the ratio (never dropped silently —
          # counted in unmatched_seconds), and two planted-discrepancy
          # regressions — bot exclusion and the source gate itself — each
          # verified by actually breaking scripts/coaching_talk_ratio.py
          # on disk, confirming the test failed, and restoring it clean.
          #
          # scripts/eval_transcript_store.py (run above by TEST 0) covers
          # the extraction side: _extract_apollo_participant_identities()
          # id-keying, is_internal derivation, bot flagging, and that
          # participant_identities flows through build_transcript_row()
          # (always present, explicitly None for non-Apollo sources).
          PYTHONPATH=.:scripts:api:scripts/analytics python3 scripts/test_coaching_talk_ratio.py

      - name: "TEST 0bh — Offline: loss-concentration primitive (assess_loss_concentration)"
        run: |
          set -e
          # 2026-09-20: NORTH_STAR.md CRO Priority #5, the buildable half
          # of the win/loss pattern-reasoning audit. query_win_loss already
          # exists and reads win_loss_narratives, but does zero aggregation
          # in code — pattern reasoning is left entirely to the synthesis
          # model. The audit split that gap in two: competitor-mention/
          # stated-reason reasoning is BLOCKED by a hard data ceiling
          # (deals.lost_reason 0% populated fleet-wide, win_loss_
          # narratives.competitor_mentioned 1.7% populated) — not built
          # here, same class as MEDDICC's 1.2% coverage. Rep/segment/
          # stage-of-loss concentration has NO such ceiling — computed
          # directly from deals.owner_email/segment/
          # highest_stage_order_reached, independent of win_loss_
          # narratives entirely.
          #
          # Design decisions confirmed before building: time-window
          # scoped with an insufficient_data floor (never a rate off too
          # few deals); rep/segment breakdowns are RATE-normalized vs. the
          # team average with their own per-row min-n=5 floor
          # (insufficient_volume, not a misleading 100%/0% off 1-2
          # deals); stage-of-loss uses the CANONICAL BUCKET mapping
          # (field_semantics.stage_bucket()), not raw
          # highest_stage_order_reached — confirmed live during scoping
          # that two administrative stages (Review/Disqualified, orders 8
          # and 9) sit OUT OF SEQUENCE after the real terminal stages
          # (Closed Won=6, Closed Lost=7) and accounted for 90.8% of all
          # lost deals fleet-wide at audit time — their share is reported
          # as its own explicit, labeled line, never folded into the
          # bucket breakdown. Ghost-deal ($0 deal_value) share is also
          # reported separately, not silently excluded — same precedent
          # as pipeline_coverage's HEURISTIC-vs-real-target separation.
          #
          # scripts/test_loss_concentration.py covers: the insufficient_
          # data floor, rate-normalization with the min-n floor, the
          # bucket-vs-raw-order stage mapping (using the real config/
          # client.yaml, not mocked), the ghost-deal share, and two
          # planted-discrepancy proofs — breaking the order->stage_id
          # mapping and breaking the loss-rate formula — each verified by
          # actually editing scripts/loss_concentration.py on disk,
          # confirming the relevant test failed, and restoring it clean
          # (confirmed via a post-restore re-run, not just trusted).
          PYTHONPATH=.:scripts:api python3 scripts/test_loss_concentration.py

      - name: "TEST 0c — Offline: date/time-window resolution (single-source-of-truth gate)"
        run: |
          set -e
          # Structural gate for the 2026-09-10 date-window incident class:
          # resolve_time_window() must be the ONLY place "today" or a
          # relative time span gets converted to concrete dates anywhere in
          # api/. Fails the build the moment a new parallel implementation
          # (a bare date.today(), or unrouted/unmarked timedelta(days=...)
          # math) is added, instead of waiting for a fourth live follow-up
          # question to find it. See test_date_resolution_single_source.py
          # for the full incident history this closes.
          PYTHONPATH=. python3 tests/test_date_resolution_single_source.py
          PYTHONPATH=. python3 tests/test_time_window_resolution.py
          PYTHONPATH=. python3 tests/test_snapshot_anchors.py

      - name: "TEST 0d — Offline: dynamic-loop budget shortcuts (enrichment lookup + schema visibility)"
        run: |
          set -e
          # 2026-09-11 budget-exhaustion fix: a snapshot-diff question still
          # blew the token budget on a genuinely-needed third call because
          # (a) deals_snapshot.region/segment existed in Postgres but were
          # never registered in data_dictionary, so the model believed they
          # didn't exist and fell back to a full re-query of deals, and
          # (b) even a truly unavoidable ID-scoped enrichment call (company
          # name for already-matched deal_ids) fell through to a fresh
          # full-budget loop iteration instead of synthesizing immediately.
          # test_enrichment_shortcut.py also carries unit coverage for the
          # round-3 fix in TEST 0i below (_snapshot_anchor_redirect_
          # instruction, _build_missing_snapshot_fetch) — same file since
          # it's the same snapshot-anchor mechanism family.
          PYTHONPATH=. python3 tests/test_schema_context_snapshot_visibility.py
          PYTHONPATH=. python3 tests/test_enrichment_shortcut.py

      - name: "TEST 0e — Offline: data-dictionary registration gate (new migrations)"
        run: |
          set -e
          # Same pattern as the date-resolution gate, for a different bug
          # class: deals_snapshot.region/segment existed in Postgres and
          # were fully populated for days while being completely invisible
          # to the dynamic query loop, because registering a new column in
          # data_dictionary is a separate, skippable step from the
          # migration that adds it — and it got skipped. This is forward-
          # looking only (new migrations past 062); the full historical
          # picture needs live credentials, see TEST 1b below.
          PYTHONPATH=. python3 tests/test_data_dictionary_registration.py

      - name: "TEST 0f — Offline: scratchpad/narration must not ship as the final answer"
        run: |
          set -e
          # 2026-09-11: the dynamic loop's "prose answer" fallback path (for
          # when the model doesn't wrap its response in {"answer": ...}
          # JSON) accepted ANY non-JSON text over 50 chars as the final
          # Slack message. A live response shipped a scratchpad table plus
          # "let me use what I have and produce the answer now" plus a
          # second answer attempt, all concatenated, because nothing
          # checked whether the "prose answer" was actually finished.
          # ROUND 2 (same day): a second live run of the same question
          # shipped "Now I have both snapshots. Let me diff them
          # properly." verbatim, because neither "now i have both" nor
          # "let me diff" was a recognized narration marker, AND because
          # the JSON-wrapped `if "answer" in parsed:` branch never called
          # the scratchpad check at all — a second entry point for a
          # finished answer, independent of the prose-fallback path.
          PYTHONPATH=. python3 tests/test_scratchpad_answer_rejection.py

      - name: "TEST 0h — Offline: pipeline/stage id lookup + snapshot-diff reporting scope"
        run: |
          set -e
          # 2026-09-11 round 2, same live run as TEST 0f's round 2: a
          # response found several dropped deals with stage_id 1297321618
          # and GUESSED "these appear to be a renewal pipeline" instead of
          # looking it up — a knowable fact (it IS the Renewal Pipeline's
          # "Upcoming Renewal" stage) that the schema context never
          # surfaced to the model. Separately, the same response silently
          # folded a real owner reassignment (Christian -> Scott Keller,
          # no stage change) into "no change", and left 11 population
          # entries / several population exits as a vague aside instead of
          # a labeled category. test_pipeline_stage_lookup.py pins the
          # schema-context fix (a complete, pipeline-annotated stage
          # glossary built from config/client.yaml); test_snapshot_diff_
          # reporting_scope.py pins the prompt instructions for the
          # scoping decision (stage changes / population entries /
          # population exits as three separate labeled categories, owner
          # changes surfaced as an explicit aside rather than hidden).
          PYTHONPATH=. python3 tests/test_pipeline_stage_lookup.py
          PYTHONPATH=. python3 tests/test_snapshot_diff_reporting_scope.py

      - name: "TEST 0i — Offline: scratchpad-rejection retries force the missing snapshot anchor, not a partial answer"
        run: |
          set -e
          # 2026-09-11 round 3, same live run again: the scratchpad-
          # rejection retry mechanism (TEST 0f) and the "both snapshot
          # anchors required" gate (TEST 0d) were in conflict for this
          # question shape. When the model narrated twice in a row
          # instead of tool-calling, the shared no_progress_streak retry
          # budget exhausted before the prior snapshot was ever queried —
          # and _finalize_from_data used to synthesize straight from
          # whatever existed, which was only ONE of the two required
          # snapshots. Two fixes: (1) the corrective message sent after a
          # scratchpad rejection now names the SPECIFIC missing
          # snapshot_date and tells the model to query it
          # (_snapshot_anchor_redirect_instruction), instead of only
          # "stop narrating"; (2) if that still doesn't land in time,
          # _finalize_from_data itself forces ONE direct, non-
          # conversational filter_table call for the missing anchor
          # (_build_missing_snapshot_fetch) before falling through to
          # synthesis or giving up — the missing date is already known
          # deterministically, so this isn't a guess.
          # test_snapshot_finalize_forced_fetch.py drives the REAL
          # dynamic_query_loop end-to-end (scripted LLM responses, stubbed
          # DB/classification) reproducing the exact interaction: one real
          # tool call, two scratchpad narrations in a row, then confirms
          # the forced fetch happens and the finalize synthesis call
          # actually sees both snapshots — plus a negative control proving
          # the forced fetch is a no-op when both anchors were already
          # queried. The extracted helpers get direct unit coverage in
          # test_enrichment_shortcut.py.
          PYTHONPATH=. python3 tests/test_snapshot_finalize_forced_fetch.py

      - name: "TEST 0j — Offline: finalize shortcuts must not synthesize blind to their own data"
        run: |
          set -e
          # 2026-09-11 round 4: a live run reported "could not turn the
          # partial data into an answer" despite accumulated_data holding
          # complete, correct data (29-row current snapshot, 31-row prior
          # snapshot, 11-row company_name enrichment lookup) at finalize
          # time. Root cause: tool results only reach the model doing
          # synthesis through `messages` entries injected after each
          # iteration's tool call — accumulated_data is bookkeeping, never
          # sent to the model directly. Two early-return shortcuts
          # (dimension_retry_succeeded, id_scoped_enrichment_lookup) jump
          # straight to `return await _finalize_from_data(...)` and used
          # to skip that message-append entirely, because it lives further
          # down in code an early return never reaches. The finalize
          # synthesis call then ran on a `messages` history missing the
          # exact data that just triggered the shortcut — the model had
          # nothing to answer from, and (with NO exception anywhere) its
          # response failed to parse as {"answer": ...}, falling through
          # to the generic diagnostic despite complete, correct data the
          # whole time. Fixed via _append_tool_result_message(), called at
          # both shortcut sites before their early return.
          # test_finalize_shortcut_message_gap.py drives the REAL
          # dynamic_query_loop end-to-end reproducing the exact reported
          # accumulated_data shape (including the "missing step_1" —
          # a duplicate call that short-circuits without storing data),
          # confirms the finalize context now includes the enrichment
          # data, confirms a real answer results instead of the give-up
          # diagnostic, and — via a negative control that neutralizes the
          # fix — confirms the mechanism itself (not the test harness) is
          # what makes the data visible.
          PYTHONPATH=. python3 tests/test_finalize_shortcut_message_gap.py

      - name: "TEST 0k — Offline: snapshot stage-change diffs are computed in code, never asked of the LLM"
        run: |
          set -e
          # 2026-09-11 round 5: three consecutive live-test failures
          # (TEST 0f/0i's unfinished scratchpad text and narrate-twice
          # retry exhaustion, TEST 0j's lost enrichment data) were three
          # different failure MODES of one root cause — the model was
          # being asked to diff two snapshot row sets in free text, which
          # is a deterministic set operation, not a reasoning task an LLM
          # should ever perform in prose. api/snapshot_diff.py's
          # diff_snapshots() computes stage changes / population entries
          # / population exits / owner-change asides in code. Wired into
          # dynamic_query_loop's _finalize_from_data: whenever both
          # snapshot anchors' rows are present in accumulated_data, the
          # finalize prompt now embeds the ALREADY-COMPUTED structured
          # result and explicitly forbids the model from recomputing it —
          # the model's job narrows to writing clean prose from a given
          # structure, never diffing two snapshots itself again.
          # test_snapshot_diff.py covers diff_snapshots() correctness
          # against the exact 29-row/31-row shape from the incident logs
          # (stage changes, entries, exits, owner-change asides, the
          # stage_order-with-stage_id-fallback comparison), plus an
          # end-to-end proof that the finalize prompt sent to the LLM
          # contains the computed diff and never the old prompt that
          # asked the model to produce the comparison itself.
          PYTHONPATH=. python3 tests/test_snapshot_diff.py

      - name: "TEST 0l — Offline: dimension terms are resolved proactively, before the model can guess"
        run: |
          set -e
          # 2026-09-11: every dimension-related bug this week (a
          # fabricated "EMEA isn't a tracked region," a missing region/
          # segment filter) was caught REACTIVELY, by verify_dimension_
          # coverage() below, after the model had already guessed —
          # sometimes guessing wrong out loud to the user. api/dimension_
          # resolver.py's resolve_dimension_filter() looks up any term a
          # model might extract from a question against the SAME
          # governed sources already built elsewhere (regions.yaml,
          # client.yaml's segmentation.bands, client.yaml's team roster)
          # and returns the exact filter clause — deterministically, no
          # DB or LLM call. scan_question_for_known_dimension_terms() is
          # wired into dynamic_query_loop BEFORE the model's first tool
          # call: it resolves every plausible term in the question and
          # injects a directive (same pattern as SNAPSHOT ANCHORS) so the
          # model never has to guess which column/value a term means.
