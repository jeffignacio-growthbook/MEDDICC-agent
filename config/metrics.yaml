# Metric Registry
#
# Canonical definitions for all metrics computed by the agent.
# Each metric includes:
#   - formula: How it's computed
#   - population: Which deals/records qualify
#   - freshness: When to use snapshot vs live data
#   - verified: Reconciled reference values
#   - coverage_caveat: Data quality warnings
#   - not_applicable_to: Where this metric doesn't apply

# Reference Source Metadata
#
reference_source:
  name: "HubSpot Custom Retention Report"
  created_by: "Unknown"
  last_verified: "2026-08-28"
  known_exclusions:
    - deal: "Lion Studios"
      quarter: "Q1 FY2027"
      impact: "$37.5K expansion excluded from Q1 NRR"
      reason: "Unknown - exclusion deliberate (in report filters)"
      handler_behavior: "Handler includes this deal"
    - deal: "x.ai"
      quarter: "Q3 FY2027"
      impact: "$300K renewal excluded"
      reason: "Unknown - exclusion deliberate"
      handler_behavior: "Handler includes this deal"
    - deal: "Anthropic"
      quarter: "Q4 FY2027"
      impact: "$810K renewal + $500K expansion excluded (40% of Q4 renewal ARR)"
      reason: "Unknown - exclusion deliberate"
      handler_behavior: "Handler includes this deal"
      note: "Excluding largest renewal from Q4 retention calculation is significant"
  reconciliation_scope:
    valid_quarters: ["Q1 FY2027", "Q2 FY2027"]
    invalid_quarters: ["Q3 FY2027", "Q4 FY2027"]
    reason: "Q3/Q4 report population differs from handler population"
  action_required: |
    Determine WHY these deals were excluded from HubSpot report:
    - Deliberate outlier exclusion? (if so, document rationale)
    - Different treatment category? (if so, handler should match)
    - Report error? (if so, report needs fixing)
    Until exclusion rationale is known, unclear which view (handler vs report) is correct.

grr:
  label: Gross Revenue Retention
  formula: SUM(IF(closed_won, renewal_revenue, 0)) / SUM(renewal_revenue)
  population: renewal pipeline only
  freshness: historical  # closed quarters are snapshot-definitive
  verified:
    q1_fy2027_closed_only: 0.77
    reconciled_against: HubSpot retention report (closed deals only)
    reconciled_on: 2026-08-28
    tolerance: 0.005  # ±0.5pp acceptable variance
    handler_output: 0.7668  # within tolerance (0.32pp variance)
  q3_q4_note: |
    No verified values for Q3/Q4 - report excludes x.ai and Anthropic.
    See NRR metric for exclusion details.
  coverage_caveat: |
    renewal_revenue is ~83% populated in forward quarters.
    Floor: 50% coverage required to report.
    Q1 FY2027 closed deals: 100% coverage.
  not_applicable_to:
    - default pipeline
    - new business pipeline
  views:
    closed_only:
      description: Historical fact - hs_is_closed = true
      denominator: closed deals only (won + lost)
      use_when: closed quarters, historical analysis
    assume_open_wins:
      description: Forward-looking - counts open as won
      denominator: all deals (won + lost + open)
      use_when: current quarter forecasting

churn:
  label: Dollar Churn Rate
  formula: 1 - GRR
  population: renewal pipeline only
  freshness: historical
  verified:
    q1_fy2027_closed_only: 0.23  # 1 - 0.77
    reconciled_against: Derived from verified GRR (HubSpot retention report)
    reconciled_on: 2026-08-28
    tolerance: 0.005  # ±0.5pp (inherited from GRR)
    handler_output: 0.2332  # within tolerance
  not_applicable_to:
    - default pipeline
    - new business pipeline

nrr:
  label: Net Revenue Retention
  formula: SUM(IF(NOT closed_lost, renewal_revenue + incremental_arr, 0)) / SUM(renewal_revenue)
  population: renewal pipeline only
  freshness: historical
  verified:
    q1_fy2027_closed_only: 1.07
    reconciled_against: HubSpot retention report (closed deals only)
    reconciled_on: 2026-08-28
    tolerance: 0.005  # ±0.5pp acceptable variance
    handler_output: 1.1182  # with all deals
    handler_output_excluding_lion_studios: 1.0694  # reconciles to 0.06pp
    reconciliation_note: |
      Handler output 111.82% vs verified 107% = 4.82pp variance.
      Excluding Lion Studios ($37.5K expansion): 106.94% = 0.06pp variance (reconciles).
      Residual: $3.4K unaccounted ($37.5K exclusion vs $34.1K gap).
      Note residual to prevent future drift absorption.
    report_exclusions: |
      HubSpot report excluded Lion Studios from Q1. Reason unknown.
      Exclusion was deliberate (built into report filters).
      Without understanding why, unclear whether handler (includes it) or
      report (excludes it) provides the more useful retention view.
    q3_q4_note: |
      No verified values for Q3/Q4. HubSpot report excludes:
      - Q3: x.ai ($300K renewal)
      - Q4: Anthropic ($810K renewal + $500K expansion = 40% of Q4 renewal ARR)
      Report and handler measure different populations.
      Cannot reconcile until exclusion rationale is understood.
  coverage_caveat: |
    incremental_arr is ~93% populated (237 of 256 renewal deals).
    NULL incremental_arr means no expansion (treat as 0).
  not_applicable_to:
    - default pipeline
    - new business pipeline
  views:
    closed_only:
      description: Historical fact - hs_is_closed = true
      denominator: closed deals only (won + lost)
      numerator: won renewal_revenue + incremental_arr
    assume_open_wins:
      description: Forward-looking - counts open as won
      denominator: all deals (won + lost + open)
      numerator: (won + open) renewal_revenue + incremental_arr

week3_conversion:
  label: Week-3 Conversion-to-Close Rate
  formula: cohort_wins / week3_snapshot_qualified
  population: new business pipeline only (default)
  freshness: quarterly  # computed from complete quarters
  basis: count  # deal count, not value
  computation_spec:
    denominator:
      source: deals_snapshot table
      snapshot_date: week_of_quarter = 3 (exactly)
      scope_filter: is_deal_in_analytics_scope(stage_id, pipeline_id)
      pipelines_included: pipeline_id = 'default' (renewals excluded)
      stages_included: qualified stages only (stage_order >= qualified_stage_order AND NOT exclude_from_analysis)
      note: Review (order 8, excluded) and Meeting Set (order 0, below qualified) are excluded
    numerator:
      cohort: deals FROM denominator set only (fixed at week 3)
      won_definition: stage in ['closedwon', '1297321623'] per field_semantics.is_won()
      deadline: close_date within fiscal quarter (by close_date, not stage transition)
      critical: NEVER include deals created or qualified after week 3
    population:
      fiscal_quarters: [FY2026 Q3, FY2026 Q4, FY2027 Q1] (Q2 excluded - incomplete snapshot)
      pipelines: default only (pipeline_id = 'default')
      deal_types: new business only (renewals in pipeline 866608541 excluded)
    method:
      type: cohort_tracking
      cohort_definition: deals in week-3 snapshot that pass is_deal_in_analytics_scope
      numerator_constraint: subset of cohort_definition (never deals outside it)
      outcome_source: current deals table (stage + close_date), not snapshot history
      date_ranges_by_quarter:
        FY2026 Q3: ["2025-11-01", "2026-01-31"]
        FY2026 Q4: ["2026-02-01", "2026-04-30"]
        FY2027 Q1: ["2026-05-01", "2026-07-31"]
  verified:
    pooled: 0.071  # 12 won / 169 qualified — VERIFIED 2026-09-04
    trailing_3q: 0.072  # arithmetic mean of per-quarter rates
    per_quarter: {fy2026_q3: 0.067, fy2026_q4: 0.083, fy2027_q1: 0.066}
    range: [0.066, 0.083]
    verified_against: computation_spec defined above
    measured_date: 2026-09-04
    computation_script: compute_week3_conversion_final.py
    prior_values_invalid: >
      All prior values (9.9%, 13.0%, 39.0%, 12.7%) computed against different
      definitions. Official function reports 22 won / 169 = 13.0% for same data
      because it counts deals created after week-3 (numerator bug lines 292-294).
    verification_checks:
      numerator_subset_of_denominator: true
      all_wins_from_week3_cohort: true
      no_post_week3_deals_in_numerator: true
      cohort_size: 169
      wins_from_cohort: 12
      wins_outside_cohort: 0
    prior_value: 0.099
    prior_per_quarter: {fy2026_q3: 0.105, fy2026_q4: 0.100, fy2027_q1: 0.092}
    change_reason: >
      Review stage (parking lot for dead deals) marked exclude_from_analysis
      on 2026-09-03. Prior 9.9% included Review in week-3 denominator.
      Current 12.7% excludes Review (164 of 475 Q1 deals) and Meeting Set
      (234 deals, pre-qualification). Denominator dropped from ~640 to 169
      across Q3-Q1, raising conversion from 9.9% to 12.7%. Both scopes are
      correct for their definitions; registry now uses current scope.
      Rates: Q3 11.1% (5/45), Q4 12.5% (6/48), Q1 14.5% (11/76).
    excluded_quarter: fy2027_q2
    q2_measured_rate: 0.244  # 29 won / 119 qualified (for reference)
    q2_exclusion_reason: >
      Snapshot grid incomplete — Q2 week-3 has 192 rows (40% of Q1's 475 rows).
      Denominator halved due to measurement artifact, not business change.
      Q2 snapshot_date 2026-05-18 captured incomplete population.
      Count-based rate unaffected by whales (top 3 deals = 31% of Q2 value).
    measured_date: 2026-09-04
    reconciled_against: >
      deals_snapshot week 3 snapshots (default pipeline only, renewals excluded,
      Review and Meeting Set excluded via is_deal_in_analytics_scope)
    scope_definition: >
      New-business qualified pipeline at week-3, unfiltered by close date,
      scoped via is_deal_in_analytics_scope. Review (order 8, excluded) and
      Meeting Set (order 0, below qualified_stage_order 1) are excluded.
      Numerator: in-quarter wins of deals FROM week-3 snapshot only.
      Denominator: week-3 scoped snapshot.
  by_segment:
    _status: INVALID
    _reason: >
      Computed 2026-09-04 with incorrect numerator methodology (counted all
      in-quarter wins instead of wins from week-3 snapshot). Values below
      are NOT VERIFIED and must be recomputed before use.
    enterprise:
      value: null  # INVALID - recompute with correct numerator
      n: 54
      won: 15
      quarters: [fy2026_q3, fy2026_q4, fy2027_q1]
      per_quarter: null  # INVALID
      note: "INVALID - computed with wrong methodology"
    mid_market:
      value: null  # INVALID - recompute with correct numerator
      n: 60
      won: 26
      quarters: [fy2026_q3, fy2026_q4, fy2027_q1]
      per_quarter: null  # INVALID
      note: "INVALID - computed with wrong methodology"
    smb:
      value: null  # INVALID - recompute with correct numerator
      n: 41
      won: 21
      quarters: [fy2026_q3, fy2026_q4, fy2027_q1]
      per_quarter: null  # INVALID
      note: "INVALID - computed with wrong methodology"
    unknown:
      value: null
      n: 14
      reason: "Below min_evidence_count threshold (30)"
  segment_divergence:
    finding: "PENDING - segment rates not yet verified"
    implication: "Use blended 12.7% until segment rates are verified with correct methodology"
    example: "$1M target → $7.9M qualified pipeline required (÷0.127)"
  not_applicable_to:
    - renewal pipeline (different motion, separate conversion rate)
  note: |
    Forecasting metric (Kellogg method): of the qualified pipeline open at
    week 3 of a quarter, what fraction closed won by quarter end.

    Denominator: Week-3 snapshot, qualified deals, NO close-date filter
    (whole qualified open pipeline competes for the quarter).

    Numerator: In-quarter terminal wins (close_date in quarter).

    Deliberate asymmetry: denominator unfiltered by close date. This is
    correct — measuring what fraction of week-3 pipeline converts in-quarter.

    NOT qualification velocity (qualified_deals / deals_created_3_weeks_ago).
    Two different metrics sharing a name — this is conversion-to-close.

coverage:
  label: Pipeline Coverage
  formula: SUM(open_pipeline) / remaining_quota
  population: all pipelines
  freshness: current  # updated daily for forecast accuracy
  verified:
    q3_fy2027: null  # not yet reconciled
    reconciled_against: pending
  note: |
    Coverage = pipeline / remaining quota.
    Forward-looking metric, never historical.

# Data quality alerts
#
data_quality:
  q1_fy2027_hygiene_issue:
    quarter: "Q1 FY2027 (Feb-Apr 2026)"
    issue: "4 open renewal deals in closed historical quarter"
    severity: high
    detail: |
      Quarter ended April 2026. As of August 2026 (4-6 months later),
      4 renewal deals remain open:
      - 3 with renewal_revenue ($28,313 total)
      - 0 with expansion
      These should have closed by now. Likely causes:
      - Deals pushed to later quarters (update close_date)
      - Deals churned but not marked lost (update stage)
      - Deals renewed but not marked won (update stage)
      Impact: Inflates assume-open-wins NRR for closed quarter.

# Vocabulary cross-reference
#
# "Due to renew" = renewal pipeline, open stages
# "Qualified" = new business, stage_order >= qualified_stage_order
# "At risk" = client-specific definition (e.g., MEDDICC score < 5)
# "Won" = stage bucket in ['closed_won']
# "Lost" = stage bucket in ['closed_lost']
# "Open" = stage bucket in ['open', 'discovery', 'scoping', 'proposal', ...]
