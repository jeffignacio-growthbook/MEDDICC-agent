name: Weekly Analytics

on:
  schedule:
    - cron: '0 3 * * 1'  # Monday 3:00 AM UTC (matches weekly-snapshot.yml grid)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write  # Allow the handler generator to open PRs

jobs:
  analytics:
    runs-on: ubuntu-latest
    environment: Agent
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Note: Base deals ETL now runs daily via daily-analytics-etl.yml
      # This weekly job focuses on snapshot/waterfall/forecast/enrichment

      - name: Snapshot deals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/analytics/snapshot_deals.py

      - name: Compute waterfall
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/analytics/compute_waterfall_segmented.py

      - name: Compute forecast
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/analytics/compute_forecast.py

      # 2026-09-26: pipeline_generation_quarterly (renamed from
      # pipeline_generation_weekly) had no writer wired into any workflow —
      # a second frozen artifact alongside the qualified_date bug, stuck at
      # 2026-08-11 for 6+ weeks. Full recompute each run (script clears and
      # rewrites all rows), same cadence as waterfall/forecast above.
      - name: Compute pipeline generation (quarterly)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/analytics/compute_pipeline_generation.py

      - name: Generate win/loss narratives
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/analytics/generate_win_loss.py \
            --limit 25 --yes

      - name: Extract objections
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/enrichment/extract_objections.py \
            --limit 50 --yes

      - name: Extract feature gaps
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/enrichment/extract_feature_gaps.py \
            --limit 50 --yes

      # -----------------------------------------------------------------------
      # Monitoring alerts — run after precomputed tables are fresh so
      # stale-table checks reflect the just-written values. Each script
      # reads config/monitoring.yaml for thresholds and posts to Slack via
      # ZAPIER_MONITORING_WEBHOOK_URL when a threshold is breached.
      # continue-on-error: true so a monitor failure never blocks enrichment.
      # -----------------------------------------------------------------------

      - name: Monitor data completeness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ZAPIER_MONITORING_WEBHOOK_URL: ${{ secrets.ZAPIER_MONITORING_WEBHOOK_URL }}
        run: python scripts/monitor_data_completeness.py
        continue-on-error: true

      - name: Monitor forecast category coverage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ZAPIER_MONITORING_WEBHOOK_URL: ${{ secrets.ZAPIER_MONITORING_WEBHOOK_URL }}
        run: python scripts/monitor_forecast_category_coverage.py
        continue-on-error: true

      - name: Monitor stale precomputed tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ZAPIER_MONITORING_WEBHOOK_URL: ${{ secrets.ZAPIER_MONITORING_WEBHOOK_URL }}
        run: python scripts/monitor_stale_precomputed_tables.py
        continue-on-error: true

      - name: Monitor bulk closed-lost (7-day lookback)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ZAPIER_MONITORING_WEBHOOK_URL: ${{ secrets.ZAPIER_MONITORING_WEBHOOK_URL }}
        run: python scripts/monitor_bulk_closed_lost.py --lookback-hours 168
        continue-on-error: true

      - name: Monitor unscored late-stage deals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ZAPIER_MONITORING_WEBHOOK_URL: ${{ secrets.ZAPIER_MONITORING_WEBHOOK_URL }}
        run: python scripts/monitor_unscored_late_stage.py
        continue-on-error: true

      - name: Monitor snapshot coverage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ZAPIER_MONITORING_WEBHOOK_URL: ${{ secrets.ZAPIER_MONITORING_WEBHOOK_URL }}
        run: python scripts/monitor_snapshot_coverage.py
        continue-on-error: true

      - name: Weekly learning report + handler generation
        if: github.event_name == 'schedule'
        # Only on scheduled runs, not manual triggers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZAP_REPLY_URL: ${{ secrets.ZAP_REPLY_URL }}
          SLACK_REPORT_CHANNEL: ${{ secrets.SLACK_REPORT_CHANNEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python scripts/weekly_learning_report.py \
            --slack --generate-handlers --create-pr
        continue-on-error: true

      - name: Check enrichment schema gaps
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZAP_REPLY_URL: ${{ secrets.ZAP_REPLY_URL }}
          SLACK_REPORT_CHANNEL: ${{ secrets.SLACK_REPORT_CHANNEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python scripts/weekly_learning_report.py \
            --check-schema-gaps --slack --days 7
        continue-on-error: true
