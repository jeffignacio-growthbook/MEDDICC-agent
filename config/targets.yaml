# Sales targets by quarter
# Used to calculate gap to plan, attainment %, and required pipeline coverage
#
# IMPORTANT: Emails match HubSpot owner records exactly. Mixed convention is
# deliberate: James and Scott use full form (james.shannon@, scott.keller@),
# others use short form. HubSpot is the system of record. These are the
# emails that actually own deals.
# DO NOT "normalize" to one format - it will break the join with
# deals.owner_email.
#
# marsh@growthbook.io (Andy Marshall) and kris@growthbook.io (Kris Washburn):
# these are the HubSpot owner-record emails, NOT andy.marshall@growthbook.io
# or any other form. andy.marshall@growthbook.io does not own deals in
# HubSpot and must never be used here.
#
# role: "ae" (new-logo/new-business book) or "am" (expansion/renewal book).
# Both roles are measured on the SAME metric, incremental_arr (new_arr +
# expansion_arr) — role labels whose book of business a rep's number comes
# from, not a different metric. See config/client.yaml's quota_roles
# comment for the full history of this fix.
#
# team_total is INTENTIONALLY NOT stored here. It is computed as the sum of
# this quarter's rep targets (by scripts/seed_targets.py when writing
# rep_targets, and by scripts/utils.py::build_semantic_context when
# rendering semantic context) so the team figure can never drift from the
# rows it is supposed to equal. If you need "what is the team total right
# now", sum the reps below (or read the live rep_targets 'team' row, which
# is written from this same computation).

targets:
  fy2027_q3:
    basis: incremental_arr  # Reps are measured on Incremental ARR, never renewal base
    stretch_target: 2100000
    stretch_note: >
      Ryan's personal aspiration — NOT additive on top of quota.
      The team quota (computed from the reps below, $2,031,069 for
      FY2027 Q3) is the committed goal. The stretch ($2.1M) is a
      separate, higher aspiration: Ryan wants to beat $2.1M for the
      quarter to hit 2x YoY growth (Q3'27 vs Q3'26). Report stretch
      separately as aspirational context, never sum it with quota.
      Confirmed 2026-10-01. Never assume this generalizes to any
      future client this codebase might serve.
    reps:
      jake@growthbook.io:
        role: ae
        target: 325000
      christian@growthbook.io:
        role: ae
        target: 250000
      james.shannon@growthbook.io:
