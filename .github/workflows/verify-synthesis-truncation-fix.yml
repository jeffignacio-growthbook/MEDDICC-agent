name: Verify Synthesis Truncation Fix (one-off)

# One-off diagnostic workflow, not part of the regular gates. READ-ONLY —
# route_question() does not write to HubSpot or Supabase (see
# scripts/test_question.py's own docstring). Reused across two related
# live verifications rather than creating a second workflow file:
#
# 1. query_pipeline's and query_stale_deals' realistic baseline questions
#    through the REAL production code path (scripts/test_question.py →
#    route_question()), confirming the rendered, synthesized answer
#    states the full totals (313 deals for "show me our pipeline"; 64
#    deals / $987,194.02 for "what deals are stale") now that api/
#    router.py's synthesis-truncation fix (STRUCTURED_HANDLERS-based, see
#    PENDING_WORK.md's "SYSTEMIC FINDING: Synthesis-truncation bug is
#    pipeline-wide") is live. CONFIRMED 2026-09-19 (run 35441623265).
#
# 2. Handler 5/6 (query_win_loss) migration to unified routing: Step C's
#    baseline capture (tests/fixtures/capture_query_win_loss_baseline.py,
#    direct handler call against live data) plus a live rendered-answer
#    check through the same real production path, now that query_
#    win_loss is registered as a dynamic-loop tool — the same synthesis-
#    layer scrutiny Steps A-D alone don't provide (see PENDING_WORK.md's
#    Handler 5 entry). CONFIRMED 2026-09-19 (run 35442557240, after a
#    first run — 35442311297 — crashed and surfaced the _resolve_tw()
#    bug fixed in the same commit as the retry).
#
# 3. Handler 6/6 (query_deals_at_risk) migration to unified routing —
#    the final handler in the Phase 2 migration set. Same Step C
#    discipline: direct-handler baseline capture (tests/fixtures/
#    capture_query_deals_at_risk_baseline.py, including a raw-unresolved
#    time_window case specifically re-testing the _resolve_tw() fix
#    against this handler too) plus a live rendered-answer check.
#
# Safe to delete once these one-time confirmations are done.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: Agent
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "query_pipeline baseline question — realistic default, 313-deal payload"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
        run: |
          python scripts/test_question.py "show me our pipeline"

      - name: "query_stale_deals baseline question — realistic default, 64-deal / $987,194.02 payload"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
        run: |
          python scripts/test_question.py "what deals are stale"

      - name: "Handler 5 Step C — query_win_loss direct-handler baseline capture"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python tests/fixtures/capture_query_win_loss_baseline.py
          echo "---- captured fixture ----"
          cat tests/fixtures/query_win_loss_baseline.json

      - name: "Handler 5 Step C — query_win_loss live rendered answer (unified routing)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
        run: |
          python scripts/test_question.py "why are we losing"

      - name: "Handler 5 Step C — query_win_loss live rendered answer, second phrasing"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
        run: |
          python scripts/test_question.py "give me a win loss summary for this quarter"

      - name: "Handler 6 Step C — query_deals_at_risk direct-handler baseline capture"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python tests/fixtures/capture_query_deals_at_risk_baseline.py
          echo "---- captured fixture ----"
          cat tests/fixtures/query_deals_at_risk_baseline.json

      - name: "Handler 6 Step C — query_deals_at_risk live rendered answer (unified routing)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
        run: |
          python scripts/test_question.py "which deals are at risk"

      - name: "Handler 6 Step C — query_deals_at_risk live rendered answer, second phrasing"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
        run: |
          python scripts/test_question.py "which deals have champion gaps this quarter"
