name: "One-off: reset and re-run sales signals"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: Agent
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reset wrongly-scanned sales_signals data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cat <<'PYEOF' > /tmp/reset.py
          import os, sys
          sys.path.insert(0, 'scripts')
          from supabase import create_client
          from supabase_client import select_all
          sb = create_client(os.environ['SUPABASE_URL'],
                             os.environ['SUPABASE_SERVICE_KEY'])

          before = select_all(sb, 'enrichment_scans', columns='call_id,job',
              filters=[('eq', 'job', 'sales_signals')])
          print(f"sales_signals ledger rows before: {len(before)}")

          # Clear ALL sales_signals ledger rows, not just the ones that
          # produced output — 3 of the 8 returned zero signals and would
          # otherwise stay marked as scanned.
          res = (sb.table('enrichment_scans').delete()
                 .eq('job', 'sales_signals').execute())
          print(f"  cleared: {len(res.data or [])}")

          for t in ['deal_risks', 'competitive_signals', 'pipeline_signals']:
              r = sb.table(t).delete().neq('id', -1).execute()
              print(f"  emptied {t}: {len(r.data or [])} row(s)")

          after = select_all(sb, 'enrichment_scans', columns='call_id',
              filters=[('eq', 'job', 'sales_signals')])
          print(f"sales_signals ledger rows after: {len(after)}")
          PYEOF
          python3 /tmp/reset.py

      - name: Re-run extractor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/enrichment/extract_sales_signals.py \
            --limit 30 --yes

      - name: What landed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cat <<'PYEOF' > /tmp/show.py
          import os, sys
          sys.path.insert(0, 'scripts')
          from supabase import create_client
          from supabase_client import select_all
          sb = create_client(os.environ['SUPABASE_URL'],
                             os.environ['SUPABASE_SERVICE_KEY'])
          rows = select_all(sb, 'deal_risks',
              columns='company_name,risk_description,rep_name')
          print(f"=== deal_risks: {len(rows)} ===")
          for r in rows[:20]:
              print(f"  {(r['company_name'] or '?')[:22]:22s} | "
                    f"{(r['rep_name'] or '-')[:12]:12s} | "
                    f"{(r['risk_description'] or '')[:70]}")
          rows = select_all(sb, 'competitive_signals',
              columns='competitor_name,context,deal_company')
          print(f"\n=== competitive_signals: {len(rows)} ===")
          for r in rows[:20]:
              print(f"  {(r['competitor_name'] or '?')[:18]:18s} | "
                    f"{(r['deal_company'] or '-')[:18]:18s} | "
                    f"{(r['context'] or '')[:60]}")
          rows = select_all(sb, 'pipeline_signals',
              columns='signal_type,company_name,description')
          print(f"\n=== pipeline_signals: {len(rows)} ===")
          for r in rows[:20]:
              print(f"  {r['signal_type']:12s} | "
                    f"{(r['company_name'] or '?')[:20]:20s} | "
                    f"{(r['description'] or '')[:60]}")
          PYEOF
          python3 /tmp/show.py
