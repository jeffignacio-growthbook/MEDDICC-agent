          # no resolver at all) and query_sdr_metrics and query_sdr_
          # pipeline_sourced (raw sdr_email eq, no resolver) now all
          # route through _resolve_owner_email() (accepts a name or an
          # email) and filter via ilike instead of eq. query_stale_deals
          # needed two distinct fixes: its owner_email was already
          # resolved via _resolve_owner_email() but the downstream
          # filter was still eq — a name resolves to user_personas.email
          # verbatim, with no case-fold, so the same casing risk
          # survived resolution; and its stage param reached an eq
          # filter completely raw, with no canonicalization against
          # deals.stage's actual raw-HubSpot-id storage — fixed via a
          # new _resolve_stage_id() helper that resolves a model-
          # extracted human label (e.g. "Technical Evaluation") to its
          # raw stage_id (presentationscheduled), case-insensitively,
          # via api/field_semantics.py's own label/alias tables, falling
          # through unchanged for a value matching neither. Not verified
          # live — no Supabase/Railway access from this sandbox.
          #
          # Round 2 (same file, appended after re-checking the SHAPE of
          # this fix across the handlers already touched tonight, not
          # just owner_email/sdr_email): query_pipeline's stage_filter
          # in-memory comparison had the identical fragility (`bucket !=
          # stage_filter`, exact-case against a lowercase bucket keyword)
          # — not hypothetical, scripts/test_q011_exact.py exists
          # specifically because the classifier has spontaneously
          # emitted stage_filter despite it not being in the documented
          # params schema. Fixed by case-folding and falling back to
          # _resolve_stage_id() + stage_bucket() for a value matching no
          # known bucket keyword (a human label like "Technical
          # Evaluation").
          PYTHONPATH=. python3 tests/test_owner_email_canonicalization.py

      - name: "TEST 0z — Offline: structured handler results reach synthesis whole, never truncated mid-object"
        run: |
          set -e
          # 2026-09-19: the Handler 4 (query_rep_pipeline) truncation fix
          # (94 real deals silently reduced to 16-25 by an unconditional
          # json.dumps(result)[:3000] cut before the LLM ever saw the tool
          # result) was detected via a pattern-match on query_rep_pipeline's
          # OWN return shape ("summary" in result and "total_deals" in
          # result["summary"]) — not a real "is this a finished, structured
          # result" test. Auditing the three OTHER already-migrated
          # handlers (query_pipeline, query_stale_deals, query_waterfall)
          # against that exact condition found all three fail it
          # structurally, and their own previously-captured production
          # baselines confirmed this is not theoretical: query_pipeline's
          # realistic "show me pipeline" payload is 7,654 chars and query_
          # stale_deals' realistic "what deals are stale" payload is
          # 14,207 chars — both routinely truncated to 3,000 chars before
          # synthesis, the exact Handler 4 bug, live, on two handlers
          # already marked "complete." See PENDING_WORK.md, "SYSTEMIC
          # FINDING: Synthesis-truncation bug is pipeline-wide."
          #
          # Fixed structurally: any handler registered in api.evaluator.
          # STRUCTURED_HANDLERS (the same registry evaluate_result()
          # already uses to know a handler's return isn't raw "rows" to
          # sample) is never truncated, regardless of its specific shape —
          # via one shared helper, _serialize_tool_result_for_synthesis(),
          # used at BOTH truncation sites in api/router.py (the main loop
          # body, and _append_tool_result_message() — a second,
          # independent, unconditional [:3000] site the original Handler 4
          # fix never touched, used by three early-return synthesis
          # shortcuts). Genuinely unbounded raw data (filter_table, etc.)
          # keeps the existing cap.
          #
          # This closes the exact gap that let the bug reach production
          # unnoticed across 4 handler migrations: the existing baseline-
          # capture fixtures (capture_query_pipeline_baseline.py, capture_
          # query_stale_deals_baseline.py) call handlers directly, bypassing
          # api/router.py's synthesis step entirely — they verify handler
          # output, never what the LLM actually receives. Rather than
          # rewire those fixtures to also drive a live LLM + Supabase (slow,
          # non-deterministic, costly on every CI run) for a check that
          # doesn't need either, this is a deterministic, dedicated
          # synthesis-level test using the SAME captured production
          # baseline JSON, driving the real dynamic_query_loop end-to-end
          # with a scripted LLM client — confirming query_pipeline's and
          # query_stale_deals' worst-case real payloads (including a real
          # company name that sits past the old 3000-char cutoff in each)
          # now reach the synthesis call whole; a negative control proves
          # the STRUCTURED_HANDLERS check specifically (not the test
          # harness) is what makes the data visible; and a fourth test
          # confirms a genuinely unstructured raw-row result (filter_table)
          # is still truncated — this fix targets finished handler results,
          # not every large tool result.
          PYTHONPATH=. python3 tests/test_synthesis_truncation_fix.py

      - name: "TEST 1a — Offline: Supabase client retries once on a dead HTTP/2 connection instead of failing the request"
        run: |
          set -e
          # 2026-09-11: a live test session against the deployed app hit
          # httpx.RemoteProtocolError: ConnectionTerminated repeatedly,
          # mid-request, across unrelated handlers — a long-lived
          # singleton Supabase client (get_supabase() in api/db.py;
          # SupabaseWriter in scripts/supabase_client.py) hitting
          # httpcore's own is_available() checkout gap: a pooled HTTP/2
          # connection can look fine at checkout even after the server
          # already sent GOAWAY, since the local check has no way to know
          # until the client actually tries the next stream — at which
          # point httpcore raises RemoteProtocolError directly, bypassing
          # httpx's own ConnectionNotAvailable-based pool retry entirely.
          # httpx.HTTPTransport(retries=N) does NOT cover this either —
          # confirmed via httpcore's own docstring, that parameter only
          # retries CONNECTION-ESTABLISHMENT failures. Fixed with
          # _RetryOnDeadConnectionTransport (scripts/supabase_client.py),
          # injected into both get_supabase() and SupabaseWriter via
          # supabase.ClientOptions(httpx_client=...). Predates and is
          # unrelated to tonight's canonicalization work (git log showed
          # neither file touched by any commit before this fix).
          PYTHONPATH=. python3 tests/test_supabase_retry_transport.py

      - name: "TEST 1c — Offline: zero-rows suspicion is verified for compliance, not just flagged"
        run: |
          set -e
          # 2026-09-11 (PRIMITIVE_CHECKLIST.md follow-up): the zero-rows
          # suspicion note (fires when a "which/show/list" enumeration
          # question returns zero rows from filter_table) told the model
          # to broaden its filter or state what was checked instead of
          # asserting absence — but nothing ever verified either
          # happened, exactly the "detect, log, ship anyway" gap this
          # checklist exists to catch. Not caught by test_primitive_
          # contract.py's structural scan because it's inline code with
          # no function name matching that test's naming patterns — found
          # by manual review, the same way the original three gaps were.
          # Fixed with the same compliance-check shape as ambiguous_
          # dimension_unaddressed (TEST 0w): if the suspicion fired and
          # no LATER tool call in the same loop found real rows (self-
          # correction — same allowance as false_partial_claim_caught /
          # scratchpad_rejection_fired), the final answer must at least
          # acknowledge the check was made, or get a caveat appended and
          # its own queryable outcome bucket
          # (answered_with_unresolved_zero_row_suspicion). Also fixed a
          # separate, unrelated staleness bug found along the way:
          # test_zero_rows_suspicion.py's third test had been failing
          # since 2026-09-06 (excluded from every gate run since) because
          # it checked scripts/utils.py's build_semantic_context() for
