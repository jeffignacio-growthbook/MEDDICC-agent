name: "One-off: first sales signals batch"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: Agent
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract sales signals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/enrichment/extract_sales_signals.py \
            --limit 30 --yes

      - name: What landed in the three tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cat <<'PYEOF' > /tmp/show.py
          import os, sys
          sys.path.insert(0, 'scripts')
          from supabase import create_client
          from supabase_client import select_all
          sb = create_client(os.environ['SUPABASE_URL'],
                             os.environ['SUPABASE_SERVICE_KEY'])
          rows = select_all(sb, 'deal_risks',
              columns='company_name,risk_description,rep_name')
          print(f"=== deal_risks: {len(rows)} ===")
          for r in rows[:15]:
              print(f"  {(r['company_name'] or '?')[:24]:24s} | "
                    f"{(r['risk_description'] or '')[:80]}")
          rows = select_all(sb, 'competitive_signals',
              columns='competitor_name,context,deal_company')
          print(f"\n=== competitive_signals: {len(rows)} ===")
          for r in rows[:15]:
              print(f"  {(r['competitor_name'] or '?')[:20]:20s} | "
                    f"{(r['context') or ''][:80]}")
          rows = select_all(sb, 'pipeline_signals',
              columns='signal_type,company_name,description')
          print(f"\n=== pipeline_signals: {len(rows)} ===")
          for r in rows[:15]:
              print(f"  {r['signal_type']:12s} | "
                    f"{(r['company_name'] or '?')[:20]:20s} | "
                    f"{(r['description'] or '')[:60]}")
          PYEOF
          python3 /tmp/show.py
