name: Diagnostic Re-derivation Check

on:
  schedule:
    # Run monthly on the 1st at 9am UTC
    - cron: '0 9 1 * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  check-rederivation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install supabase python-dotenv

      - name: Check diagnostic re-derivation status
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/check_diagnostic_rederivation.py

      - name: Create issue if trigger fired
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Diagnostic Classifier Re-derivation Trigger Fired',
              body: '## Re-Derivation Required\n\nThe diagnostic classifier has reached the 20-escalation threshold.\n\n**Action Required:**\n- Owner: @jeffignacio\n- Deadline: Within 2 weeks\n\n**Procedure:**\nSee `DIAGNOSTIC_REDERIVATION_PROCEDURE.md` for steps.\n\n**Checklist:**\n- [ ] Export human-reviewed escalations\n- [ ] Analyze current classifier accuracy\n- [ ] Re-tune thresholds from real production data\n- [ ] Validate new thresholds\n- [ ] Update code and documentation\n\n---\nAuto-generated by diagnostic-rederivation-check workflow',
              assignees: ['jeffignacio'],
              labels: ['diagnostic-classifier', 're-derivation']
            })
