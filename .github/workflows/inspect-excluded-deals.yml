name: Inspect Excluded Deals

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase

      - name: Find deals matching exclusion patterns
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -c "
          import os
          from supabase import create_client

          sb = create_client(os.getenv('SUPABASE_URL'), os.getenv('SUPABASE_SERVICE_KEY'))

          # Find deals with names containing the excluded patterns
          result = sb.table('deals').select('deal_id, deal_name, company_name, deal_value, deal_status, create_date, close_date').execute()

          excluded_patterns = ['anthropic', 'x.ai', 'x-']
          matching_deals = []

          for d in result.data:
              name = d.get('deal_name', '').lower()
              for pattern in excluded_patterns:
                  if pattern in name:
                      matching_deals.append({
                          'deal_name': d.get('deal_name'),
                          'company_name': d.get('company_name'),
                          'deal_value': d.get('deal_value'),
                          'deal_status': d.get('deal_status'),
                          'create_date': d.get('create_date'),
                          'close_date': d.get('close_date'),
                          'pattern': pattern
                      })
                      break

          print('='*80)
          print(f'EXCLUDED DEAL PATTERNS INSPECTION')
          print('='*80)
          print(f'Total deals matching exclusion patterns: {len(matching_deals)}')
          print()

          # Show first 5 as examples
          print('Sample deal names (first 5):')
          print()
          for i, d in enumerate(matching_deals[:5], 1):
              print(f'{i}. \"{d[\"deal_name\"]}\"')
              print(f'   Company: {d[\"company_name\"]}')
              print(f'   Value: \${float(d.get(\"deal_value\") or 0):,.0f}')
              print(f'   Status: {d[\"deal_status\"]}')
              print(f'   Created: {d[\"create_date\"]}')
              print(f'   Close date: {d[\"close_date\"]}')
              print(f'   Matched pattern: \"{d[\"pattern\"]}\"')
              print()
          "
